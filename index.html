<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GymAI</title>

<link rel="icon" type="image/png" id="app-icon" href="icon-light.png">
<link rel="apple-touch-icon" id="app-apple-icon" href="icon-light.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymAI">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light dark;

  --bg: #ffffff;
  --bg-secondary: #f5f5f7;
  --text-primary: #1d1d1f;
  --text-secondary: #86868b;
  --accent: #0071e3;
  --accent-dark: #0059b3;

  --ring-stretch: #64d2ff;
  --ring-gym: #0071e3;
  --ring-pool: #32ade6;
  --ring-sauna: #ff9f0a;

  --success: #34c759;
  --success-bg: #e8f8ec;
  --danger: #ff3b30;
  --danger-bg: #fdeceb;
  --warn-text: #b5680b;
  --warn-bg: #fff4e5;
  --info-text: #0059b3;
  --info-bg: #eaf3ff;
  --ai-text: #1a7a3d;
  --ai-bg: #eefaf1;
  --skip-bg: #ffe9e6;

  --border: #e5e5ea;
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 20px rgba(0, 0, 0, 0.06);

  --blur-surface: rgba(255, 255, 255, 0.9);
  --modal-overlay: rgba(0, 0, 0, 0.4);
  --loading-overlay: rgba(255, 255, 255, 0.85);
  --toast-bg: rgba(29, 29, 31, 0.92);
  --toast-text: #ffffff;

  --blur-edge: rgba(255, 255, 255, 0.85);
  --blur-surface: rgba(255, 255, 255, 0.4);

  --font: -apple-system, BlinkMacSystemFont, "SF Pro JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --bg-secondary: #1c1c1e;
    --text-primary: #f5f5f7;
    --text-secondary: #98989d;
    --accent: #409cff;
    --accent-dark: #7cbcff;

    --ring-gym: #409cff;

    --success: #30d158;
    --success-bg: #10241a;
    --danger: #ff453a;
    --danger-bg: #2c1210;
    --warn-text: #ffb340;
    --warn-bg: #2a2110;
    --info-text: #7cbcff;
    --info-bg: #0d2340;
    --ai-text: #58d68d;
    --ai-bg: #10241a;
    --skip-bg: #3a1613;

    --border: #2c2c2e;
    --shadow: 0 2px 20px rgba(0, 0, 0, 0.6);

    --blur-surface: rgba(0, 0, 0, 0.72);
    --modal-overlay: rgba(0, 0, 0, 0.6);
    --loading-overlay: rgba(0, 0, 0, 0.82);
    --toast-bg: rgba(245, 245, 247, 0.92);
    --toast-text: #1d1d1f;

    --blur-edge: rgba(0, 0, 0, 0.85);
    --blur-surface: rgba(0, 0, 0, 0.4);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-secondary);
  font-family: var(--font);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

button, input, textarea, select {
  font-family: inherit;
}

a { color: var(--accent); }

#app {
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}

.nav-bar {
  padding: 12px 20px 8px;
  position: sticky;
  top: 0;
  /* 上端に向かって半透明から透明へグラデーションさせつつブラーをかける */
  background: linear-gradient(
    to bottom,
    var(--blur-edge) 0%,
    var(--blur-surface) 100%
  );
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  z-index: 5;
  border-bottom: 1px solid var(--border);
}
.nav-bar h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

#content {
  flex: 1;
  /* 上部にステータスバーを避けるための安全な余白（env(safe-area-inset-top) + 20px）を確保 */
  padding: calc(25px + env(safe-area-inset-top)) 20px 100px;
}

/* ---------- タブバー ---------- */
.tabbar {
  position: sticky;
  bottom: 0;
  display: flex;
  background: var(--blur-surface);
  backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--border);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index: 5;
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 2px;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: color 0.2s ease;
}
.tab-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tab-btn span { font-size: 11px; font-weight: 500; }
.tab-btn.active { color: var(--accent); }

/* ---------- 見出し ---------- */
.page-title { margin: 4px 0 14px; }
.page-title h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.page-title h3 { margin: 24px 0 10px; font-size: 17px; font-weight: 600; color: var(--text-secondary); }

/* ---------- Today ヘッダー / リング ---------- */
.today-header { text-align: center; padding-bottom: 8px; }
.today-date { color: var(--text-secondary); font-size: 14px; font-weight: 500; margin: 0 0 8px; }
.rings-wrap { display: flex; justify-content: center; }
.rings-svg { width: 190px; height: 190px; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--bg-secondary); stroke-width: 14; }
.ring-progress { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1); }
.rings-legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 16px; }
.rings-legend span { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
.rings-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.ai-comment { font-size: 14px; color: var(--text-primary); background: var(--bg-secondary); padding: 12px 16px; border-radius: var(--radius-md); margin: 12px 0; text-align: left; line-height: 1.5; }

.btn-refresh { width: 100%; margin-top: 4px; }

/* ---------- バナー ---------- */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; text-align: left; margin: 8px 0; }
.banner-info { background: var(--info-bg); color: var(--info-text); }
.banner-warn { background: var(--warn-bg); color: var(--warn-text); }
.banner-ai { background: var(--ai-bg); color: var(--ai-text); justify-content: center; }
.banner-link { background: none; border: none; font-weight: 600; color: inherit; text-decoration: underline; cursor: pointer; white-space: nowrap; padding: 0; }

/* ---------- メニューセクション / カード ---------- */
.menu-section { margin-top: 28px; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.section-icon { font-size: 24px; }
.section-header h2 { margin: 0; font-size: 17px; font-weight: 700; }
.section-sub { margin: 0; font-size: 12px; color: var(--text-secondary); }
.section-count { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-secondary); background: var(--bg-secondary); padding: 4px 10px; border-radius: 20px; }

.item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  transition: background 0.2s ease, opacity 0.2s ease;
}
.item-card.done { background: var(--success-bg); border-color: transparent; }
.item-main { min-width: 0; flex: 1 1 140px; }
.item-name { margin: 0; font-size: 15px; font-weight: 600; }
.item-detail { margin: 2px 0 0; font-size: 13px; color: var(--text-secondary); }
.item-badge { display: inline-block; margin-top: 6px; font-size: 11px; color: var(--warn-text); background: var(--warn-bg); padding: 2px 8px; border-radius: 10px; }
.btn-weight-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-primary);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-weight-pill:active { transform: scale(0.94); }

.item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-pill {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-primary);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.btn-change { color: var(--accent); border-color: var(--info-bg); }
.btn-video { color: var(--accent); border-color: var(--info-bg); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn-done.active { background: var(--success); color: #fff; border-color: transparent; }
.btn-pill:active { transform: scale(0.94); }

/* ---------- 難易度フィードバック ---------- */
.difficulty-card { margin-top: 28px; text-align: center; }
.difficulty-card .field-label { margin: 0 0 12px; text-align: center; font-size: 14px; }
.difficulty-row { display: flex; gap: 8px; }
.diff-btn { flex: 1; padding: 12px 8px; font-size: 14px; }
.diff-btn[data-difficulty="easy"].active { background: var(--success); color: #fff; border-color: transparent; }
.diff-btn[data-difficulty="just"].active { background: var(--accent); color: #fff; border-color: transparent; }
.diff-btn[data-difficulty="hard"].active { background: var(--danger); color: #fff; border-color: transparent; }

/* ---------- 空の状態 ---------- */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-state.small { padding: 30px 16px; }
.empty-emoji { font-size: 40px; margin: 0 0 8px; }
.empty-state h2 { font-size: 19px; margin: 0 0 6px; }
.empty-state p { color: var(--text-secondary); font-size: 14px; margin: 0 0 18px; }

/* ---------- ボタン共通 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; transition: transform 0.15s ease, opacity 0.15s ease; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-outline { background: var(--bg); color: var(--accent); border: 1px solid var(--accent); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-outline { background: var(--bg); color: var(--danger); border: 1px solid var(--danger); width: 100%; }
.btn-text-danger { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; }
.btn-text-edit { background: none; border: none; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; }
.btn-compact { padding: 9px 16px; font-size: 13px; flex-shrink: 0; }

/* ---------- 記録タブ ---------- */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px 8px; text-align: center; }
.stat-value { margin: 0; font-size: 22px; font-weight: 700; }
.stat-label { margin: 2px 0 0; font-size: 11px; color: var(--text-secondary); }

.history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.history-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px 14px; }
.history-row-left { min-width: 0; flex: 1; }
.history-date { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.history-stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }
.history-diff-badge { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--bg); color: var(--text-secondary); }
.mini-rings-svg { width: 44px; height: 44px; transform: rotate(-90deg); flex-shrink: 0; }
.mini-ring-track { fill: none; stroke: var(--bg); stroke-width: 9; }
.mini-ring-progress { fill: none; stroke-width: 9; stroke-linecap: round; }

/* ---------- 体の変化タブ ---------- */
.card { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; }
.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; }
.field-label:first-child { margin-top: 0; }
.text-input { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 15px; color: var(--text-primary); resize: vertical; }
.text-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.label-with-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 0 6px;
}
.label-with-info .field-label {
  margin: 0;
}
.btn-info-icon {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  border-radius: 50%;
  width: 20px;
  height: 20px;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: all 0.15s ease;
}
.btn-info-icon:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.card .btn-primary { width: 100%; margin-top: 18px; }

.measure-gap { font-size: 13px; color: var(--text-secondary); margin: 0 0 14px; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); }
.measure-gap.warn { color: var(--danger); font-weight: 700; }

.body-header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
.body-header-date { margin: 0; font-size: 13px; color: var(--text-secondary); font-weight: 600; line-height: 1.4; }

.body-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.body-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px 14px; }
.body-row-date { margin: 0; font-size: 13px; font-weight: 700; }
.body-row-detail { margin: 3px 0 0; font-size: 13px; color: var(--text-secondary); }
.body-row-memo { margin: 4px 0 0; font-size: 12px; color: var(--text-secondary); font-style: italic; }
.body-row-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }

.page-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn-graph-icon {
  background: none;
  border: 1px solid var(--border);
  color: var(--accent);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  font-size: 15px;
  transition: all 0.15s ease;
}
.btn-graph-icon:hover { border-color: var(--accent); background: var(--info-bg); }
.chart-legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 0 0 10px; }
.chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
.chart-legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }

/* ---------- 設定タブ ---------- */
.settings-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 14px; }
.settings-hint { font-size: 12px; color: var(--text-secondary); margin: 8px 0 0; }
.input-with-btn { display: flex; gap: 8px; align-items: center; }
.input-with-btn .text-input { flex: 1; }
.btn-icon-toggle { border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); width: 42px; height: 42px; flex-shrink: 0; cursor: pointer; font-size: 16px; }
.settings-actions { display: flex; gap: 10px; margin-top: 18px; }
.settings-actions .btn { flex: 1; }
.settings-status { font-size: 13px; font-weight: 600; margin: 12px 0 0; min-height: 18px; }
.settings-status.success { color: var(--success); }
.settings-status.error { color: var(--danger); }
.age-display { font-size: 12px; color: var(--text-secondary); margin: 6px 0 0; }

/* ---------- Googleアカウント / クラウド同期 ---------- */
.account-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.account-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: var(--bg); border: 1px solid var(--border); }
.account-avatar-placeholder { display: grid; place-items: center; font-size: 20px; }
.account-main { min-width: 0; flex: 1; }
.account-name { margin: 0; font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-email { margin: 3px 0 0; font-size: 12px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 0; }
.sync-status { margin: 0; font-size: 12px; color: var(--text-secondary); }
.sync-status.success { color: var(--success); }
.sync-status.error { color: var(--danger); }
.google-btn { width: 100%; background: var(--bg); color: var(--text-primary); border: 1px solid var(--border); }
.google-mark { width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 50%; font-weight: 800; color: #4285f4; background: #fff; }
.firebase-details { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 12px; }
.firebase-details summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; }
.firebase-config-input { min-height: 132px; margin-top: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.setup-steps { margin: 10px 0 0; padding-left: 20px; color: var(--text-secondary); font-size: 12px; line-height: 1.6; }
.rules-box { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-secondary); }

/* ---------- モーダル ---------- */
.overlay { position: fixed; inset: 0; background: var(--modal-overlay); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.overlay.hidden { display: none; }
.modal { background: var(--bg); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.modal-icon { font-size: 22px; }
.modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; }
.modal-detail { font-size: 14px; color: var(--text-secondary); margin: 0 0 8px; }
.modal-tip { font-size: 14px; line-height: 1.6; background: var(--bg-secondary); padding: 12px 14px; border-radius: var(--radius-md); margin: 0 0 18px; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn, .modal-actions a.btn { flex: 1; text-align: center; }

/* ---------- 重量記録モーダル（電卓風UI） ---------- */
.weight-display {
  text-align: center;
  font-size: 40px;
  font-weight: 700;
  margin: 18px 0 4px;
  color: var(--text-primary);
}
.weight-unit { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-left: 4px; }
.weight-best-hint { text-align: center; font-size: 12px; color: var(--text-secondary); margin: 0 0 16px; }
.weight-btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.weight-adj-btn {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-primary);
  border-radius: 14px;
  padding: 14px 0;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease;
}
.weight-adj-btn:active { transform: scale(0.94); background: var(--bg-secondary); }

/* ---------- トースト ---------- */
#toast-container { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 440px; padding: 0 20px; pointer-events: none; }

/* ---------- 状態管理 ---------- */
function defaultState() {
  return {
    settings: { apiKey: "", model: DEFAULT_MODEL },
    profile: { heightCm: null, gender: "", birthYear: null },
    today: null,
    historyLog: [],
    bodyRecords: [],
    completedCounts: {},
    bestWeights: {}
  };
}

let state = loadState();
let currentTab = 'today';
let selectedTargetChips = [];
let selectedGenderChip = '';
let bodyFormOpen = false;
let editingBodyRecordId = null;
let firebaseAuth = null;
let firestoreDb = null;
let currentGoogleUser = null;
let cloudSyncReady = false;
let cloudSaveTimer = null;
let authUnsubscribe = null;
let cloudSyncStatus = '未接続';
let cloudSyncStatusType = '';

function normalizeState(parsed) {
  const base = defaultState();
  if (!parsed || typeof parsed !== 'object') return base;
  const today = parsed.today && parsed.today.menu ? Object.assign({}, parsed.today, {
    menu: Object.fromEntries(['stretch', 'gym', 'pool', 'sauna'].map(category => [
      category,
      (parsed.today.menu[category] || []).map(item => Object.assign({}, item, {
        status: item.status === 'done' ? 'done' : 'pending'
      }))
    ]))
  }) : null;
  const historyLog = (Array.isArray(parsed.historyLog) ? parsed.historyLog : [])
    .map(day => Object.assign({}, day, {
      items: (Array.isArray(day.items) ? day.items : [])
        .filter(item => item.status === 'done')
        .map(item => Object.assign({}, item, { status: 'done' }))
    }))
    .filter(day => day.items.length);
  return {
    settings: Object.assign({}, base.settings, parsed.settings),
    profile: Object.assign({}, base.profile, parsed.profile),
    today,
    historyLog,
    bodyRecords: Array.isArray(parsed.bodyRecords) ? parsed.bodyRecords : [],
    completedCounts: parsed.completedCounts || {},
    bestWeights: parsed.bestWeights || {}
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalizeState(JSON.parse(raw)) : defaultState();
  } catch (e) {
    console.error('状態の読み込みに失敗しました', e);
    return defaultState();
  }
}

function saveState(options = {}) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (!options.localOnly) queueCloudSave();
  } catch (e) {
    console.error('状態の保存に失敗しました', e);
    showToast('保存に失敗しました（ストレージ容量を確認してください）', 'error');
  }
}

/* ---------- Googleアカウント / Firestore同期 ---------- */
function normalizeFirebaseConfig(config) {
  if (!config || typeof config !== 'object') return null;
  const normalized = {
    apiKey: String(config.apiKey || '').trim(),
    authDomain: String(config.authDomain || '').trim(),
    projectId: String(config.projectId || '').trim(),
    appId: String(config.appId || '').trim()
  };
  return Object.values(normalized).every(Boolean) ? normalized : null;
}

function loadFirebaseConfig() {
  try {
    const saved = localStorage.getItem(FIREBASE_CONFIG_STORAGE_KEY);
    return normalizeFirebaseConfig(saved ? JSON.parse(saved) : DEFAULT_FIREBASE_CONFIG);
  } catch (e) {
    console.error('Firebase設定の読み込みに失敗しました', e);
    return null;
  }
}

function setCloudSyncStatus(message, type = '') {
  cloudSyncStatus = message;
  cloudSyncStatusType = type;
  const el = document.getElementById('cloud-sync-status');
  if (el) {
    el.textContent = message;
    el.className = `sync-status ${type}`.trim();
  }
}

function cloudSafeState() {
  const copy = JSON.parse(JSON.stringify(state));
  // Gemini APIキーは秘密情報のためFirestoreへ送らない。
  if (copy.settings) copy.settings.apiKey = '';
  return copy;
}

function queueCloudSave() {
  if (!cloudSyncReady || !currentGoogleUser || !firestoreDb) return;
  clearTimeout(cloudSaveTimer);
  setCloudSyncStatus('変更を同期中…');
  cloudSaveTimer = setTimeout(() => pushStateToCloud(), 700);
}

async function pushStateToCloud() {
  if (!cloudSyncReady || !currentGoogleUser || !firestoreDb) return;
  clearTimeout(cloudSaveTimer);
  try {
    setCloudSyncStatus('同期中…');
    await firestoreDb.collection('users').doc(currentGoogleUser.uid).set({
      state: cloudSafeState(),
      email: currentGoogleUser.email || '',
      displayName: currentGoogleUser.displayName || '',
      clientUpdatedAt: Date.now(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setCloudSyncStatus('同期済み', 'success');
  } catch (e) {
    console.error('クラウド保存に失敗しました', e);
    setCloudSyncStatus(firebaseErrorMessage(e), 'error');
  }
}

async function hydrateStateFromCloud(user) {
  setCloudSyncStatus('データを読み込み中…');
  const docRef = firestoreDb.collection('users').doc(user.uid);
  const snapshot = await docRef.get();
  if (snapshot.exists && snapshot.data().state) {
    const localApiKey = state.settings.apiKey;
    const cloudState = normalizeState(snapshot.data().state);
    cloudState.settings.apiKey = localApiKey;
    state = cloudState;
    saveState({ localOnly: true });
    cloudSyncReady = true;
    setCloudSyncStatus('同期済み', 'success');
    renderApp();
  } else {
    // このアカウントにデータがない場合だけ、端末内の既存データを初期データとして移行する。
    cloudSyncReady = true;
    await pushStateToCloud();
  }
}

function firebaseErrorMessage(error) {
  const code = error && error.code ? error.code : '';
  const messages = {
    'auth/popup-closed-by-user': 'ログイン画面が閉じられました',
    'auth/popup-blocked': 'ポップアップがブロックされました',
    'auth/unauthorized-domain': 'このドメインがFirebaseで許可されていません',
    'auth/network-request-failed': 'ネットワークへ接続できません',
    'permission-denied': 'Firestoreのアクセス権がありません'
  };
  return messages[code] || (error && error.message ? error.message : 'クラウド同期に失敗しました');
}

async function initializeFirebaseSync() {
  const config = loadFirebaseConfig();
  if (!config) {
    setCloudSyncStatus('Firebase未設定');
    return;
  }
  if (!window.firebase) {
    setCloudSyncStatus('Firebase SDKを読み込めませんでした', 'error');
    return;
  }
  try {
    if (!firebase.apps.length) firebase.initializeApp(config);
    firebaseAuth = firebase.auth();
    firestoreDb = firebase.firestore();
    await firebaseAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    if (authUnsubscribe) authUnsubscribe();
    authUnsubscribe = firebaseAuth.onAuthStateChanged(async user => {
      currentGoogleUser = user;
      cloudSyncReady = false;
      if (!user) {
        setCloudSyncStatus('未ログイン');
        if (currentTab === 'settings') renderApp();
        return;
      }
      try {
        const lastUid = localStorage.getItem(LAST_FIREBASE_UID_STORAGE_KEY);
        if (lastUid && lastUid !== user.uid) {
          // 別アカウントのローカルキャッシュを、新しいアカウントへ誤って移行しない。
          const localSettings = state.settings;
          state = defaultState();
          state.settings = Object.assign({}, state.settings, localSettings);
          saveState({ localOnly: true });
        }
        localStorage.setItem(LAST_FIREBASE_UID_STORAGE_KEY, user.uid);
        await hydrateStateFromCloud(user);
      } catch (e) {
        console.error('クラウドデータの読み込みに失敗しました', e);
        setCloudSyncStatus(firebaseErrorMessage(e), 'error');
        if (currentTab === 'settings') renderApp();
      }
    });
  } catch (e) {
    console.error('Firebaseの初期化に失敗しました', e);
    setCloudSyncStatus(firebaseErrorMessage(e), 'error');
  }
}

async function signInWithGoogle() {
  if (location.protocol === 'file:') {
    throw new Error('Googleログインには http://localhost または公開URLで開く必要があります');
  }
  if (!firebaseAuth) throw new Error('先にFirebase設定を保存してください');
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  await firebaseAuth.signInWithPopup(provider);
}

/* ---------- ユーティリティ ---------- */
function uid() {
  return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function todayStr(d) {
  const date = d || new Date();
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateLabel(ds) {
  const d = new Date(ds + 'T00:00:00');
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  return `${d.getMonth() + 1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;
}

function daysBetween(dsFrom, dsTo) {
  const a = new Date(dsFrom + 'T00:00:00');
  const b = new Date(dsTo + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function ytSearchUrl(query) {
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query + " やり方 フォーム 解説");
}

function makeItem(name, detail, tip) {
  return { id: uid(), name, detail, tip: tip || '', status: 'pending' };
}

// 重量の見た目を整形（22.5→"22.5" / 20.0→"20" のように無駄な小数を出さない）
function formatWeight(w) {
  if (w == null || isNaN(w)) return '-';
  return (Math.round(w * 10) / 10).toString();
}

// その種目の重量の初期値：自己ベスト（あれば）→ 種目ごとの目安値 → 20kg の優先順で決定
function defaultWeightFor(name) {
  const best = state.bestWeights ? state.bestWeights[name] : null;
  if (typeof best === 'number' && !isNaN(best)) return best;
  return DEFAULT_START_WEIGHT[name] != null ? DEFAULT_START_WEIGHT[name] : 20;
}

// 今日のジムメニューの器具名から、鍛えている部位（体の部位名）を割り出す
function getGymFocusParts(gymItems) {
  const names = (gymItems || []).map(g => g.name);
  const parts = new Set();
  BODY_TARGET_MAP.forEach(rule => {
    if (rule.targets.some(t => names.includes(t))) {
      rule.keywords.forEach(k => {
        const raw = (MUSCLE_EXPLANATIONS[k] && MUSCLE_EXPLANATIONS[k].part) || k;
        // 「腕（前側）」のような注釈を外し、検索クエリ向けにシンプルな部位名にする
        parts.add(raw.replace(/（.*?）/g, ''));
      });
    }
  });
  return Array.from(parts);
}

// ストレッチは「トレーニング前」「トレーニング後」の2項目に固定し、
// 今日のジムメニューの内容に合わせたYouTube検索クエリを組み立てる
function buildStretchItems(gymItems) {
  const parts = getGymFocusParts(gymItems);
  const partsText = parts.length ? parts.join(' ') : '全身';
  return FIXED_STRETCH_TEMPLATES.map(t => {
    const item = makeItem(t.name, t.detail);
    item.videoQuery = `${t.prefix} ストレッチ ${partsText}`;
    return item;
  });
}

// ジムの種目が「変更」で入れ替わった際、ストレッチの動画検索クエリも今日のメニューに合わせて更新する
function refreshStretchVideoQueries() {
  if (!state.today) return;
  const parts = getGymFocusParts(state.today.menu.gym);
  const partsText = parts.length ? parts.join(' ') : '全身';
  (state.today.menu.stretch || []).forEach(item => {
    const template = FIXED_STRETCH_TEMPLATES.find(t => t.name === item.name);
    if (template) item.videoQuery = `${template.prefix} ストレッチ ${partsText}`;
  });
}

function normalizeMenu(raw) {
  raw = raw || {};
  const eligibleNames = getEligibleExercises();
  const eligibleSet = new Set(eligibleNames);
  const selectedNames = new Set();
  const gym = [];

  (Array.isArray(raw.gym) ? raw.gym : []).forEach(g => {
    if (!g || !eligibleSet.has(g.name) || selectedNames.has(g.name) || gym.length >= 6) return;
    const item = makeItem(g.name, typeof g.reps === 'string' && g.reps ? g.reps : pickReps());
    item.weight = (typeof g.weight === 'number' && !isNaN(g.weight)) ? g.weight : defaultWeightFor(g.name);
    selectedNames.add(g.name);
    gym.push(item);
  });

  const minimumCount = Math.min(4, eligibleNames.length);
  shuffleArray(eligibleNames).forEach(name => {
    if (gym.length >= minimumCount || selectedNames.has(name)) return;
    const item = makeItem(name, pickReps());
    item.weight = defaultWeightFor(name);
    selectedNames.add(name);
    gym.push(item);
  });

  // ストレッチは固定の2項目（トレーニング前・後）。今日のジムメニューから動画検索クエリを組み立てる
  const stretch = buildStretchItems(gym);

  // プールは泳ぎ方のみを表示し、距離や本数などの詳細情報は持たせない
  const poolStyles = [];
  (Array.isArray(raw.pool) ? raw.pool : []).forEach(p => {
    if (p && SWIM_STYLES.includes(p.style) && !poolStyles.includes(p.style) && poolStyles.length < 2) {
      poolStyles.push(p.style);
    }
  });
  if (!poolStyles.length) poolStyles.push(pickRandom(SWIM_STYLES));
  const pool = poolStyles.map(style => makeItem(style, ''));

  // サウナは常に固定の1項目とし、時間などの詳細情報は持たせない
  const sauna = [makeItem('サウナ', '')];

  return { stretch, gym, pool, sauna };
}

function calcAge(birthYear) {
  if (!birthYear) return null;
  const y = parseInt(birthYear, 10);
  if (!y || y < 1900) return null;
  return new Date().getFullYear() - y;
}

/* ---------- 日付管理 / アーカイブ（実施した日のみ記録） ---------- */
function menuHasAnyDone(menu) {
  return ['stretch', 'gym', 'pool', 'sauna'].some(cat => (menu[cat] || []).some(i => i.status === 'done'));
}

function createHistoryEntry(today) {
  const items = [];
  ['stretch', 'gym', 'pool', 'sauna'].forEach(category => {
    (today.menu[category] || []).filter(item => item.status === 'done').forEach(item => {
      const savedItem = { category, name: item.name, detail: item.detail || '', status: 'done' };
      if (category === 'gym' && typeof item.weight === 'number' && !isNaN(item.weight)) {
        savedItem.weight = item.weight;
      }
      items.push(savedItem);
    });
  });
  return { date: today.date, items, difficulty: today.difficulty || null };
}

function appendHistoryEntry(today) {
  const entry = createHistoryEntry(today);
  if (!entry.items.length) return;
  state.historyLog.push(entry);
  if (state.historyLog.length > 60) state.historyLog = state.historyLog.slice(-60);
}

function archiveTodayIfNeeded() {
  const ds = todayStr();
  if (state.today && state.today.date !== ds) {
    if (menuHasAnyDone(state.today.menu)) appendHistoryEntry(state.today);
    state.today = null;
  }
}

function needsNewMenu() {
  archiveTodayIfNeeded();
  return !state.today;
}

/* ---------- 体の記録 ---------- */
function getLatestBodyRecord() {
  if (!state.bodyRecords.length) return null;
  return state.bodyRecords.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0];
}

function getPreviousMeasurement(excludeDate) {
  const prior = state.bodyRecords.filter(r => r.date < excludeDate).sort((a, b) => a.date < b.date ? 1 : -1);
  return prior.length ? prior[0] : null;
}

function getLastPerformedDates() {
  const dates = Object.fromEntries(EQUIPMENT_LIST.map(name => [name, null]));
  const record = (name, date) => {
    if (Object.prototype.hasOwnProperty.call(dates, name) && date && (!dates[name] || date > dates[name])) {
      dates[name] = date;
    }
  };

  state.historyLog.forEach(day => {
    (day.items || []).forEach(item => {
      if (item.category === 'gym') record(item.name, day.date);
    });
  });
  if (state.today) {
    (state.today.menu.gym || []).forEach(item => {
      if (item.status === 'done') record(item.name, state.today.date);
    });
  }
  return dates;
}

function isExerciseAvailable(name, date) {
  const interval = RECOVERY_INTERVAL_DAYS[name];
  if (interval === undefined || interval === 0) return true;
  const lastDate = getLastPerformedDates()[name];
  if (!lastDate) return true;
  return daysBetween(lastDate, date || todayStr()) > interval;
}

function getEligibleExercises(date) {
  return EQUIPMENT_LIST.filter(name => isExerciseAvailable(name, date || todayStr()));
}

function getBestWeightsList() {
  return Object.entries(state.bestWeights || {})
    .filter(([, w]) => typeof w === 'number' && !isNaN(w))
    .sort((a, b) => a[0].localeCompare(b[0], 'ja'));
}

function matchTargetAreas(text) {
  if (!text) return [];
  const targets = new Set();
  BODY_TARGET_MAP.forEach(rule => {
    if (rule.keywords.some(k => text.includes(k))) {
      rule.targets.forEach(t => targets.add(t));
    }
  });
  return Array.from(targets);
}

function getLastDifficulty() {
  const recent = state.historyLog.slice(-1)[0];
  return recent ? recent.difficulty : null;
}

function pickReps() {
  const last = getLastDifficulty();
  let pool;
  if (last === 'hard') pool = REPS_EASY.concat(REPS_NORMAL);
  else if (last === 'easy') pool = REPS_NORMAL.concat(REPS_HARD);
  else pool = REPS_NORMAL.concat(REPS_EASY, REPS_HARD);
  return pickRandom(pool);
}

/* ---------- フォールバック（AI未使用時のダミーロジック） ---------- */
function buildFallbackMenu() {
  const latestBody = getLatestBodyRecord();
  const targetText = latestBody ? [latestBody.targetAreas, latestBody.memo].filter(Boolean).join(' ') : '';
  const priorityTargets = matchTargetAreas(targetText);
  let gymPool = shuffleArray(getEligibleExercises());
  gymPool.sort((a, b) => {
    const aPriority = priorityTargets.includes(a) ? -1 : 0;
    const bPriority = priorityTargets.includes(b) ? -1 : 0;
    return aPriority - bPriority;
  });
  const gymNames = gymPool.slice(0, 5);
  const gym = gymNames.map(name => ({ name, reps: pickReps(), weight: defaultWeightFor(name) }));

  // プールは泳ぎ方のみ（距離・本数などの詳細は持たせない）
  const pool = [{ style: pickRandom(SWIM_STYLES) }];

  let comment = "シンプルモードで作成した基本メニューです。設定タブでGemini APIキーを登録すると、AIが体の変化に合わせて自動で最適化します。";
  const lastDiff = getLastDifficulty();
  const sorted = state.bodyRecords.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  if (lastDiff === 'hard') {
    comment = "前回は少し大変だったようなので、今日は強度を抑えめにしています。無理のないペースで進めましょう。";
  } else if (lastDiff === 'easy') {
    comment = "前回は余裕があったようなので、今日は少し強度を上げています。フォームを大切に頑張りましょう。";
  } else if (sorted.length >= 2 && sorted[0].weight != null && sorted[1].weight != null) {
    const diff = sorted[0].weight - sorted[1].weight;
    if (diff < -0.1) comment = `体重が前回より${Math.abs(diff).toFixed(1)}kg減っています。順調です、この調子で続けましょう！`;
    else if (diff > 0.1) comment = `体重は前回より少し増えていますが、焦らず継続することが大切です。`;
    else comment = `体重は前回とほぼ変わりません。安定したペースで続けていきましょう。`;
  }

  return { gym, pool, comment };
}

/* ---------- Gemini API 連携 ---------- */
function buildSessionLines(day) {
  const catLabel = { stretch: 'ストレッチ', gym: 'ジム', pool: 'プール', sauna: 'サウナ' };
  const lines = [`・実施日: ${day.date}`, "  - 完了した種目リスト:"];
  ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => {
    const items = (day.items || []).filter(i => i.category === cat && i.status === 'done');
    if (!items.length) return;
    const detail = items.map(i => {
      const weight = cat === 'gym' && typeof i.weight === 'number' && !isNaN(i.weight)
        ? `（${formatWeight(i.weight)} kg）`
        : '';
      return `${i.name}${weight}`;
    }).join('、');
    lines.push(`    - ${catLabel[cat]}: ${detail}`);
  });
  lines.push(`  - 筋トレに対する難易度フィードバック: ${day.difficulty ? (DIFFICULTY_LABELS[day.difficulty] || day.difficulty) : '未回答'}`);
  return lines;
}

function buildHistorySection() {
  const recent = state.historyLog
    .filter(day => (day.items || []).some(item => item.status === 'done'))
    .slice(-3);
  if (!recent.length) {
    return ["初回のトレーニングです。過去の実施履歴はありません。"];
  }
  const lines = [];
  recent.forEach(day => {
    lines.push(...buildSessionLines(day));
    lines.push('');
  });
  return lines;
}

function buildUserPrompt() {
  const lines = [];
  const { heightCm, gender, birthYear } = state.profile;
  const age = calcAge(birthYear);

  lines.push("【プロフィール】");
  lines.push(`・身長: ${heightCm != null && heightCm !== '' ? heightCm + ' cm' : '未入力'}`);
  lines.push(`・性別: ${gender || '未入力'}`);
  lines.push(`・年齢: ${age != null ? age + ' 歳' : '未入力'}`);

  lines.push("");
  lines.push("【各種目ごとの最後に実施した日程】");
  const lastPerformedDates = getLastPerformedDates();
  Object.keys(RECOVERY_INTERVAL_DAYS).forEach(name => {
    lines.push(`・${name}: ${lastPerformedDates[name] || '未実施'}`);
  });

  lines.push("");
  lines.push("【過去の実施履歴（直近3回分・完了したメニューのみ）】");
  lines.push(...buildHistorySection());

  lines.push("");
  lines.push("【種目ごとの自己ベスト（最高重量）】");
  const bestWeights = getBestWeightsList();
  if (bestWeights.length) {
    bestWeights.forEach(([name, w]) => lines.push(`・${name}: ${formatWeight(w)} kg`));
  } else {
    lines.push("まだ記録がありません。");
  }

  lines.push("");
  lines.push("【最新の体の測定データ】");
  const latestBody = getLatestBodyRecord();
  if (latestBody) {
    lines.push(`・測定日: ${latestBody.date}`);
    lines.push(`・体重: ${latestBody.weight != null ? latestBody.weight + ' kg' : '未記録'}`);
    lines.push(`・骨格筋量: ${latestBody.muscleMass != null ? latestBody.muscleMass + ' kg' : '未記録'}`);
    lines.push(`・体脂肪量: ${latestBody.fatMass != null ? latestBody.fatMass + ' kg' : '未記録'}`);
    lines.push(`・体脂肪率: ${latestBody.fatPercent != null ? latestBody.fatPercent + ' %' : '未記録'}`);
    const segParts = [];
    if (latestBody.trunkMass != null) segParts.push(`体幹 ${latestBody.trunkMass} kg`);
    if (latestBody.leftArmMass != null) segParts.push(`左腕 ${latestBody.leftArmMass} kg`);
    if (latestBody.rightArmMass != null) segParts.push(`右腕 ${latestBody.rightArmMass} kg`);
    if (latestBody.leftLegMass != null) segParts.push(`左脚 ${latestBody.leftLegMass} kg`);
    if (latestBody.rightLegMass != null) segParts.push(`右脚 ${latestBody.rightLegMass} kg`);
    lines.push(`・部位別筋肉量: ${segParts.length ? segParts.join('、') : '未記録'}`);
    const targetAreas = Array.isArray(latestBody.targetAreas) ? latestBody.targetAreas.join('、') : latestBody.targetAreas;
    lines.push(`・鍛えたい部位: ${targetAreas || '特になし'}`);
    lines.push(`・メモ: ${latestBody.memo || '未入力'}`);
  } else {
    lines.push("まだ記録がありません。");
  }

  lines.push("");
  lines.push("この情報を踏まえて、今日の最適なメニューをJSONで出力してください。");
  return lines.join("\n");
}

async function callGeminiAPI() {
  const { apiKey, model } = state.settings;
  const useModel = model || DEFAULT_MODEL;
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(useModel)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents: [{ role: "user", parts: [{ text: buildUserPrompt() }] }],
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: MENU_SCHEMA,
      temperature: 0.9
    }
  };

  const res = await fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    let detail = '';
    try { const errJson = await res.json(); detail = errJson.error?.message || ''; } catch (e) { /* ignore */ }
    throw new Error(`APIエラー (${res.status}) ${detail}`);
  }

  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  if (!text) throw new Error("AIからの応答が空でした");

  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error("AIの応答をJSONとして解析できませんでした");
  }
  return parsed;
}

async function testGeminiConnection() {
  const { apiKey, model } = state.settings;
  if (!apiKey) throw new Error("APIキーが入力されていません");
  const useModel = model || DEFAULT_MODEL;
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(useModel)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = { contents: [{ role: "user", parts: [{ text: "こんにちは。これは接続テストです。「OK」とだけ返答してください。" }] }] };
  const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) {
    let detail = '';
    try { const errJson = await res.json(); detail = errJson.error?.message || ''; } catch (e) { /* ignore */ }
    throw new Error(`接続に失敗しました (${res.status}) ${detail}`);
  }
  return true;
}

/* ---------- メニュー生成のメインフロー ---------- */
async function generateMenu(options) {
  options = options || {};
  if (state.today && menuHasAnyDone(state.today.menu)) {
    appendHistoryEntry(state.today);
    state.today = null;
    saveState();
  }
  const hasKey = !!state.settings.apiKey;
  setLoading(true);

  let menu, comment, source;
  if (hasKey) {
    try {
      const raw = await callGeminiAPI();
      const normalized = normalizeMenu(raw);
      menu = normalized;
      comment = raw.comment || "今日も一緒に頑張りましょう！";
      source = 'ai';
    } catch (e) {
      console.error(e);
      const fb = buildFallbackMenu();
      menu = normalizeMenu(fb);
      comment = fb.comment;
      source = 'fallback-error';
      if (!options.silent) showToast('AIへの接続に失敗したため、シンプルメニューを表示します', 'error');
    }
  } else {
    const fb = buildFallbackMenu();
    menu = normalizeMenu(fb);
    comment = fb.comment;
    source = 'fallback';
  }

  state.today = { date: todayStr(), menu, comment, source, difficulty: null };
  saveState();
  setLoading(false);
  renderApp();
}

/* ---------- ステータス操作 ---------- */
function toggleStatus(category, id) {
  if (!state.today) return;
  const arr = state.today.menu[category];
  const idx = arr.findIndex(i => i.id === id);
  if (idx < 0) return;
  const item = arr[idx];

  if (item.status === 'done') {
    item.status = 'pending';
  } else {
    item.status = 'done';
    state.completedCounts[item.name] = (state.completedCounts[item.name] || 0) + 1;
    if (category === 'gym' && typeof item.weight === 'number' && !isNaN(item.weight)) {
      const currentBest = state.bestWeights[item.name];
      if (currentBest == null || item.weight > currentBest) {
        state.bestWeights[item.name] = item.weight;
      }
    }
  }
  saveState();
  renderApp();
}

/* ---------- ジム種目の変更（AIに問い合わせず、フロントエンドのみで完結） ---------- */
function changeGymItem(id) {
  if (!state.today) return;
  const arr = state.today.menu.gym;
  const idx = arr.findIndex(i => i.id === id);
  if (idx < 0) return;
  const oldItem = arr[idx];

  // 今日のメニューに既に含まれている種目名（変更対象自身も含む）を除外し、
  // EQUIPMENT_LIST の中から重複しない候補だけを抽出する
  const usedNames = new Set(arr.map(i => i.name));
  const candidates = getEligibleExercises().filter(name => !usedNames.has(name));

  if (!candidates.length) {
    showToast('他に変更できる種目がありません', 'error');
    return;
  }

  const newName = pickRandom(candidates);
  const newItem = makeItem(newName, oldItem.detail);
  newItem.weight = defaultWeightFor(newName);
  arr[idx] = newItem;

  refreshStretchVideoQueries();

  saveState();
  renderApp();
  showToast(`「${oldItem.name}」を「${newName}」に変更しました`, 'success');
}

/* ---------- 体の記録 ---------- */
function saveBodyRecord(fields, targetId) {
  const data = {
    weight: fields.weight,
    muscleMass: fields.muscleMass,
    fatMass: fields.fatMass,
    fatPercent: fields.fatPercent,
    trunkMass: fields.trunkMass,
    leftArmMass: fields.leftArmMass,
    rightArmMass: fields.rightArmMass,
    leftLegMass: fields.leftLegMass,
    rightLegMass: fields.rightLegMass,
    targetAreas: fields.targetAreas,
    memo: fields.memo
  };
  if (targetId) {
    // 既存レコード（今日とは限らない過去の記録も含む）をその場で更新する
    const idx = state.bodyRecords.findIndex(r => r.id === targetId);
    if (idx < 0) return;
    state.bodyRecords[idx] = Object.assign({ id: targetId, date: state.bodyRecords[idx].date }, data);
  } else {
    const ds = todayStr();
    const existingIdx = state.bodyRecords.findIndex(r => r.date === ds);
    const record = Object.assign({ id: existingIdx >= 0 ? state.bodyRecords[existingIdx].id : uid(), date: ds }, data);
    if (existingIdx >= 0) state.bodyRecords[existingIdx] = record;
    else state.bodyRecords.push(record);
  }
  saveState();
}

function deleteBodyRecord(id) {
  state.bodyRecords = state.bodyRecords.filter(r => r.id !== id);
  if (editingBodyRecordId === id) {
    editingBodyRecordId = null;
    bodyFormOpen = false;
  }
  saveState();
  renderApp();
}

/* ---------- 集計 ---------- */
function categoryCounts(category) {
  if (!state.today) return { done: 0, total: 0 };
  const arr = state.today.menu[category] || [];
  return { done: arr.filter(i => i.status === 'done').length, total: arr.length };
}

function computeDaysSinceLastTraining() {
  const dates = state.historyLog.map(d => d.date);
  const todayTrained = state.today && menuHasAnyDone(state.today.menu);
  if (todayTrained) dates.push(state.today.date);
  if (!dates.length) return null;
  const last = dates.slice().sort().slice(-1)[0];
  return daysBetween(last, todayStr());
}

/* ---------- 体の変化グラフ（外部ライブラリ不使用・ネイティブSVGで描画） ---------- */
function aggregateMonthlyBodyData() {
  const monthMap = {};
  state.bodyRecords.forEach(r => {
    const month = r.date.slice(0, 7); // "YYYY-MM" に集約
    if (!monthMap[month]) monthMap[month] = { weight: [], muscleMass: [], fatMass: [] };
    if (r.weight != null) monthMap[month].weight.push(r.weight);
    if (r.muscleMass != null) monthMap[month].muscleMass.push(r.muscleMass);
    if (r.fatMass != null) monthMap[month].fatMass.push(r.fatMass);
  });
  const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  return Object.keys(monthMap).sort().map(month => ({
    month,
    weight: avg(monthMap[month].weight),
    muscleMass: avg(monthMap[month].muscleMass),
    fatMass: avg(monthMap[month].fatMass)
  }));
}

function buildBodyChartSVG(data) {
  const width = Math.max(300, data.length * 58);
  const height = 230;
  const padding = { top: 16, right: 14, bottom: 40, left: 38 };
  const innerW = width - padding.left - padding.right;
  const innerH = height - padding.top - padding.bottom;

  let allValues = [];
  data.forEach(d => BODY_CHART_SERIES.forEach(s => { if (d[s.key] != null) allValues.push(d[s.key]); }));
  if (!allValues.length) allValues = [0, 1];
  let minV = Math.min(...allValues);
  let maxV = Math.max(...allValues);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const rangePad = (maxV - minV) * 0.15;
  minV -= rangePad; maxV += rangePad;

  const xPos = (i) => padding.left + (data.length > 1 ? (i * (innerW / (data.length - 1))) : innerW / 2);
  const yPos = (v) => padding.top + innerH - ((v - minV) / (maxV - minV)) * innerH;

  // 横方向の目盛り線と縦軸(kg)ラベル
  const gridCount = 4;
  let gridSvg = '';
  for (let g = 0; g <= gridCount; g++) {
    const v = minV + (maxV - minV) * (g / gridCount);
    const y = yPos(v);
    gridSvg += `<line x1="${padding.left}" y1="${y.toFixed(1)}" x2="${(width - padding.right).toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" />`;
    gridSvg += `<text x="${(padding.left - 6).toFixed(1)}" y="${(y + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-secondary)">${v.toFixed(1)}</text>`;
  }

  // 横軸(月)ラベル。詰まって見えにくいので斜めに表示する
  let xLabelSvg = '';
  data.forEach((d, i) => {
    const x = xPos(i);
    const y = height - padding.bottom + 14;
    xLabelSvg += `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-secondary)" transform="rotate(-40 ${x.toFixed(1)} ${y.toFixed(1)})">${escapeHtml(d.month)}</text>`;
  });

  // 体重・骨格筋量・体脂肪量の3本の折れ線。欠測月がある場合はそこで線を分割する
  let seriesSvg = '';
  BODY_CHART_SERIES.forEach(s => {
    const segments = [];
    let current = [];
    data.forEach((d, i) => {
      const v = d[s.key];
      if (v != null) {
        current.push(`${current.length === 0 ? 'M' : 'L'}${xPos(i).toFixed(1)},${yPos(v).toFixed(1)}`);
      } else if (current.length) {
        segments.push(current.join(' '));
        current = [];
      }
    });
    if (current.length) segments.push(current.join(' '));
    segments.forEach(seg => {
      seriesSvg += `<path d="${seg}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />`;
    });
    data.forEach((d, i) => {
      const v = d[s.key];
      if (v != null) seriesSvg += `<circle cx="${xPos(i).toFixed(1)}" cy="${yPos(v).toFixed(1)}" r="3.5" fill="${s.color}" />`;
    });
  });

  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" style="display:block;">${gridSvg}${xLabelSvg}${seriesSvg}</svg>`;
}

function openBodyChartModal() {
  const data = aggregateMonthlyBodyData();

  if (!data.length) {

function ringCircles(idPrefix, radii, colors) {
  const cats = ['stretch', 'gym', 'pool', 'sauna'];
  return cats.map(cat => {
    const r = radii[cat];
    const c = 2 * Math.PI * r;
    const idAttr = idPrefix ? `id="${idPrefix}-${cat}"` : '';
    return `
      <circle cx="100" cy="100" r="${r}" class="ring-track"></circle>
      <circle cx="100" cy="100" r="${r}" class="ring-progress" ${idAttr}
        stroke="${colors[cat]}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${c.toFixed(2)}"></circle>
    `;
  }).join('');
}

function renderRingsSvg() {
  const radii = { stretch: 88, gym: 68, pool: 48, sauna: 28 };
  const colors = { stretch: 'var(--ring-stretch)', gym: 'var(--ring-gym)', pool: 'var(--ring-pool)', sauna: 'var(--ring-sauna)' };
  return `<svg viewBox="0 0 200 200" class="rings-svg">${ringCircles('ring', radii, colors)}</svg>`;
}

function updateRings() {
  if (!state.today) return;
  ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => {
    const { done, total } = categoryCounts(cat);
    const percent = total ? done / total : 0;
    const circle = document.getElementById(`ring-${cat}`);
    if (!circle) return;
    const r = parseFloat(circle.getAttribute('r'));
    const c = 2 * Math.PI * r;
    const offset = c * (1 - percent);
    circle.style.strokeDashoffset = offset.toFixed(2);
  });
}

function miniRingsSvg(day) {
  const radii = { stretch: 46, gym: 35, pool: 24, sauna: 13 };
  const colors = { stretch: 'var(--ring-stretch)', gym: 'var(--ring-gym)', pool: 'var(--ring-pool)', sauna: 'var(--ring-sauna)' };
  const cats = ['stretch', 'gym', 'pool', 'sauna'];
  const circles = cats.map(cat => {
    const items = day.items.filter(i => i.category === cat);
    const done = items.filter(i => i.status === 'done').length;
    const total = items.length;
    const percent = total ? done / total : 0;
    const r = radii[cat];
    const c = 2 * Math.PI * r;
    const offset = c * (1 - percent);
    return `
      <circle cx="50" cy="50" r="${r}" class="mini-ring-track"></circle>
      <circle cx="50" cy="50" r="${r}" class="mini-ring-progress" stroke="${colors[cat]}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>
    `;
  }).join('');
  return `<svg viewBox="0 0 100 100" class="mini-rings-svg">${circles}</svg>`;
}

    ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => {

      const done = items.filter(i => i.status === 'done').length;
      counts[cat] = `${done}/${items.length}`;

    return `

          <div class="history-stats">
            <span>🤸 ${counts.stretch}</span>
            <span>🏋️ ${counts.gym}</span>

            <span>🧖 ${counts.sauna}</span>

  return `

      <div class="stat-card"><p class="stat-value">${blankDisplay}</p><p class="stat-label">前回からのブランク</p></div>
    </div>
    ${days.length ? `<ul class="history-list">${rows}</ul>` : `
      <div class="empty-state small">
        <p>まだ記録がありません。実際にトレーニングを完了すると、ここに記録が残ります。</p>
      </div>
    `}
  `;
}

function renderBodyTab() {
  const ds = todayStr();
  const todayRecord = state.bodyRecords.find(r => r.date === ds);
  const records = state.bodyRecords.slice().sort((a, b) => a.date < b.date ? 1 : -1);

  // フォームに表示するレコード：編集対象があればそれ、無ければ今日の記録（無ければ空欄の新規入力）
  const editingRecord = editingBodyRecordId
    ? state.bodyRecords.find(r => r.id === editingBodyRecordId)
    : todayRecord;

  const chips = TARGET_AREA_CHIPS.map(c => {
    const active = selectedTargetChips.includes(c) ? 'active' : '';
    return `<button type="button" class="chip ${active}" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
  }).join('');

  const prevRecord = getPreviousMeasurement(ds);
  let prevDateText;
  if (prevRecord) {
    const gapDays = daysBetween(prevRecord.date, ds);
    prevDateText = `前回測定: ${formatDateLabel(prevRecord.date)}（${gapDays}日前）`;
  } else {
    prevDateText = '前回測定: まだ記録がありません';
  }

  const val = (v) => v != null && v !== '' ? v : '';

  const list = records.map((r, i) => {
    const parts = [];
    if (r.weight != null) parts.push(`体重 ${r.weight}kg`);
    if (r.muscleMass != null) parts.push(`筋量 ${r.muscleMass}kg`);
    if (r.fatMass != null) parts.push(`脂肪量 ${r.fatMass}kg`);
    if (r.fatPercent != null) parts.push(`体脂肪率 ${r.fatPercent}%`);
    const segParts = [];
    if (r.trunkMass != null) segParts.push(`体幹 ${r.trunkMass}kg`);
    if (r.leftArmMass != null) segParts.push(`左腕 ${r.leftArmMass}kg`);
    if (r.rightArmMass != null) segParts.push(`右腕 ${r.rightArmMass}kg`);
    if (r.leftLegMass != null) segParts.push(`左脚 ${r.leftLegMass}kg`);
    if (r.rightLegMass != null) segParts.push(`右脚 ${r.rightLegMass}kg`);
    const isLatest = i === 0;
    return `
      <li class="body-row">
        <div class="body-row-main">
          <p class="body-row-date">${formatDateLabel(r.date)}</p>
          <p class="body-row-detail">${parts.length ? escapeHtml(parts.join(' ・ ')) : '数値未記録'}</p>
          ${segParts.length ? `<p class="body-row-detail">部位別筋肉量: ${escapeHtml(segParts.join(' ・ '))}</p>` : ''}
          ${r.targetAreas ? `<p class="body-row-detail">鍛えたい部位: ${escapeHtml(r.targetAreas)}</p>` : ''}
          ${r.memo ? `<p class="body-row-memo">${escapeHtml(r.memo)}</p>` : ''}
        </div>
        <div class="body-row-actions">
          <button type="button" class="btn-text-danger" data-delete-body="${r.id}">削除</button>
          ${isLatest ? `<button type="button" class="btn-text-edit" data-edit-body="${r.id}">編集</button>` : ''}
        </div>
      </li>
    `;
  }).join('');

  const formHtml = bodyFormOpen ? `
    <div class="card">
      ${editingBodyRecordId && editingRecord ? `<p class="measure-gap">「${formatDateLabel(editingRecord.date)}」の記録を編集しています。</p>` : ''}
      <div class="field-row">
        <div>
          <label class="field-label" for="input-weight">体重 (kg)</label>
          <input type="number" id="input-weight" class="text-input" step="0.1" inputmode="decimal" placeholder="例: 62.5" value="${editingRecord ? val(editingRecord.weight) : ''}">
        </div>
        <div>
          <label class="field-label" for="input-muscle">骨格筋量 (kg)</label>
          <input type="number" id="input-muscle" class="text-input" step="0.1" inputmode="decimal" placeholder="例: 24.0" value="${editingRecord ? val(editingRecord.muscleMass) : ''}">
        </div>
      </div>
      <div class="field-row">
        <div>
          <label class="field-label" for="input-fatmass">体脂肪量 (kg)</label>
          <input type="number" id="input-fatmass" class="text-input" step="0.1" inputmode="decimal" placeholder="例: 14.0" value="${editingRecord ? val(editingRecord.fatMass) : ''}">
        </div>
        <div>
          <label class="field-label" for="input-fatpercent">体脂肪率 (%)</label>
          <input type="number" id="input-fatpercent" class="text-input" step="0.1" inputmode="decimal" placeholder="例: 22.5" value="${editingRecord ? val(editingRecord.fatPercent) : ''}">
        </div>
      </div>
      <label class="field-label">部位別筋肉量 (kg・任意)</label>
      <input type="number" id="input-trunk" class="text-input" step="0.1" inputmode="decimal" placeholder="体幹　例: 22.0" value="${editingRecord ? val(editingRecord.trunkMass) : ''}">
      <div class="field-row" style="margin-top: 10px;">
        <div>
          <input type="number" id="input-arm-left" class="text-input" step="0.1" inputmode="decimal" placeholder="左腕　例: 2.5" value="${editingRecord ? val(editingRecord.leftArmMass) : ''}">
        </div>
        <div>
          <input type="number" id="input-arm-right" class="text-input" step="0.1" inputmode="decimal" placeholder="右腕　例: 2.6" value="${editingRecord ? val(editingRecord.rightArmMass) : ''}">
        </div>
      </div>
      <div class="field-row" style="margin-top: 10px;">
        <div>
          <input type="number" id="input-leg-left" class="text-input" step="0.1" inputmode="decimal" placeholder="左脚　例: 8.0" value="${editingRecord ? val(editingRecord.leftLegMass) : ''}">
        </div>
        <div>
          <input type="number" id="input-leg-right" class="text-input" step="0.1" inputmode="decimal" placeholder="右脚　例: 8.1" value="${editingRecord ? val(editingRecord.rightLegMass) : ''}">
        </div>
      </div>
      <div class="label-with-info">
        <label class="field-label">鍛えたい部位</label>
        <button type="button" class="btn-info-icon" data-action="open-muscle-guide" aria-label="筋肉の解説を見る">i</button>
      </div>
      <div class="chip-row">${chips}</div>
      <label class="field-label" for="input-memo">メモ（任意）</label>
      <textarea id="input-memo" class="text-input" rows="2" placeholder="体調やその他のメモ">${editingRecord ? escapeHtml(editingRecord.memo || '') : ''}</textarea>
      <div class="settings-actions">
        <button type="button" class="btn btn-outline" id="cancel-body-btn">キャンセル</button>
        <button type="button" class="btn btn-primary" id="save-body-btn">${editingBodyRecordId ? 'この記録を更新' : '今日の記録を保存'}</button>
      </div>
    </div>
  ` : '';

  return `
    <div class="page-title"><h2>体の変化</h2></div>
    <div class="body-header-row">
      <p class="body-header-date">${prevDateText}</p>
      <button type="button" class="btn btn-primary btn-compact" id="toggle-body-form-btn">${bodyFormOpen ? '閉じる' : '記録する'}</button>
    </div>
    ${formHtml}
    <div class="page-title page-title-row">
      <h3>これまでの記録</h3>
      ${records.length ? `<button type="button" class="btn-graph-icon" data-action="open-body-chart" aria-label="グラフで見る">📈</button>` : ''}
    </div>
    ${records.length ? `<ul class="body-list">${list}</ul>` : `<div class="empty-state small"><p>まだ記録がありません。記録すると、AIメニューに自動で反映されます。</p></div>`}
  `;
}

/* ---------- タブごとのイベントバインド ---------- */
function bindBodyTabEvents() {
  document.querySelectorAll('.chip[data-chip]').forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.chip;
      const i = selectedTargetChips.indexOf(val);
      if (i >= 0) selectedTargetChips.splice(i, 1);
      else selectedTargetChips.push(val);
      chip.classList.toggle('active');
    });
  });

  const toggleBtn = document.getElementById('toggle-body-form-btn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      if (bodyFormOpen) {
        bodyFormOpen = false;
        editingBodyRecordId = null;
      } else {
        bodyFormOpen = true;
        editingBodyRecordId = null;
        const todayRecord = state.bodyRecords.find(r => r.date === todayStr());
        selectedTargetChips = (todayRecord && todayRecord.targetAreas) ? todayRecord.targetAreas.split('、').filter(Boolean) : [];
      }
      renderApp();
    });
  }

  const cancelBtn = document.getElementById('cancel-body-btn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', () => {
      bodyFormOpen = false;
      editingBodyRecordId = null;
      renderApp();
    });
  }

  const saveBtn = document.getElementById('save-body-btn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const numOrNull = (id) => {
        const v = document.getElementById(id).value;
        return v === '' ? null : parseFloat(v);
      };
      saveBodyRecord({
        weight: numOrNull('input-weight'),
        muscleMass: numOrNull('input-muscle'),
        fatMass: numOrNull('input-fatmass'),
        fatPercent: numOrNull('input-fatpercent'),
        trunkMass: numOrNull('input-trunk'),
        leftArmMass: numOrNull('input-arm-left'),
        rightArmMass: numOrNull('input-arm-right'),
        leftLegMass: numOrNull('input-leg-left'),
        rightLegMass: numOrNull('input-leg-right'),
        targetAreas: selectedTargetChips.join('、'),
        memo: document.getElementById('input-memo').value.trim()
      }, editingBodyRecordId);
      showToast(editingBodyRecordId ? '記録を更新しました' : '記録を保存しました', 'success');
      bodyFormOpen = false;
      editingBodyRecordId = null;
      renderApp();
    });
  }

  document.querySelectorAll('[data-delete-body]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.deleteBody;
      deleteBodyRecord(id);
      showToast('記録を削除しました', 'info');
    });
  });

  document.querySelectorAll('[data-edit-body]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.editBody;
      const rec = state.bodyRecords.find(r => r.id === id);
      editingBodyRecordId = id;
      bodyFormOpen = true;
      selectedTargetChips = (rec && rec.targetAreas) ? rec.targetAreas.split('、').filter(Boolean) : [];
      renderApp();
    });
  });
}

function bindSettingsTabEvents() {
  const saveFirebaseBtn = document.getElementById('save-firebase-config-btn');
  if (saveFirebaseBtn) {
    saveFirebaseBtn.addEventListener('click', () => {
      try {
        const input = document.getElementById('firebase-config-input');
        const config = normalizeFirebaseConfig(JSON.parse(input.value));
        if (!config) throw new Error('apiKey、authDomain、projectId、appId をすべて入力してください');
        localStorage.setItem(FIREBASE_CONFIG_STORAGE_KEY, JSON.stringify(config));
        saveState({ localOnly: true });
        showToast('Firebase設定を保存しました', 'success');
        setTimeout(() => location.reload(), 500);
      } catch (e) {
        showToast(`Firebase設定を保存できません: ${e.message}`, 'error');
      }
    });
  }

  const signInBtn = document.getElementById('google-signin-btn');
  if (signInBtn) {
    signInBtn.addEventListener('click', async () => {
      signInBtn.disabled = true;
      setCloudSyncStatus('ログイン中…');
      try {
        await signInWithGoogle();
        showToast('Googleアカウントでログインしました', 'success');
      } catch (e) {
        setCloudSyncStatus(firebaseErrorMessage(e), 'error');
        showToast(firebaseErrorMessage(e), 'error');
      } finally {
        signInBtn.disabled = false;
      }
    });
  }

  const signOutBtn = document.getElementById('google-signout-btn');
  if (signOutBtn) {
    signOutBtn.addEventListener('click', async () => {
      try {
        if (cloudSaveTimer) await pushStateToCloud();
        await firebaseAuth.signOut();
        const localSettings = state.settings;
        state = defaultState();
        state.settings = Object.assign({}, state.settings, localSettings);
        saveState({ localOnly: true });
        renderApp();
        showToast('ログアウトしました', 'success');
      } catch (e) {
        showToast(firebaseErrorMessage(e), 'error');
      }
    });
  }

  const syncNowBtn = document.getElementById('sync-now-btn');
  if (syncNowBtn) {
    syncNowBtn.addEventListener('click', async () => {
      syncNowBtn.disabled = true;
      await pushStateToCloud();
      syncNowBtn.disabled = false;
    });
  }

  const copyRulesBtn = document.getElementById('copy-firestore-rules-btn');
  if (copyRulesBtn) {
    copyRulesBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(FIRESTORE_RULES);
        showToast('Firestoreルールをコピーしました', 'success');
      } catch (e) {
        const range = document.createRange();
        range.selectNodeContents(document.getElementById('firestore-rules-box'));
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        showToast('ルールを選択しました。コピーしてください', 'info');
      }
    });
  }

  document.querySelectorAll('.gender-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      selectedGenderChip = (selectedGenderChip === chip.dataset.gender) ? '' : chip.dataset.gender;
      document.querySelectorAll('.gender-chip').forEach(c => c.classList.toggle('active', c.dataset.gender === selectedGenderChip));
    });
  });

  const byInput = document.getElementById('input-birthyear');
  const ageDisplay = document.getElementById('age-display');
  if (byInput && ageDisplay) {
    byInput.addEventListener('input', () => {
      const age = calcAge(byInput.value);
      ageDisplay.textContent = age != null ? `現在 ${age}歳` : '';
    });
  }

  const saveProfileBtn = document.getElementById('save-profile-btn');
  if (saveProfileBtn) {
    saveProfileBtn.addEventListener('click', () => {
      const heightVal = document.getElementById('input-height').value;
      const birthYearVal = document.getElementById('input-birthyear').value;
      state.profile = {
        heightCm: heightVal === '' ? null : parseFloat(heightVal),
        gender: selectedGenderChip,
        birthYear: birthYearVal === '' ? null : parseInt(birthYearVal, 10)
      };
      saveState();
      showToast('プロフィールを保存しました', 'success');
    });
  }

  const toggleBtn = document.getElementById('toggle-key-visibility');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const input = document.getElementById('input-apikey');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  }

  const saveBtn = document.getElementById('save-settings-btn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      state.settings.apiKey = document.getElementById('input-apikey').value.trim();
      state.settings.model = document.getElementById('input-model').value.trim() || DEFAULT_MODEL;
      saveState();
      showToast('設定を保存しました', 'success');
    });
  }

  const testBtn = document.getElementById('test-connection-btn');
  if (testBtn) {
    testBtn.addEventListener('click', async () => {
      const statusEl = document.getElementById('settings-status');
      const tempKey = document.getElementById('input-apikey').value.trim();
      const tempModel = document.getElementById('input-model').value.trim() || DEFAULT_MODEL;
      const prevKey = state.settings.apiKey, prevModel = state.settings.model;
      state.settings.apiKey = tempKey;
      state.settings.model = tempModel;
      statusEl.textContent = '接続を確認しています…';
      statusEl.className = 'settings-status';
      testBtn.disabled = true;
      try {
        await testGeminiConnection();
        statusEl.textContent = '✅ 接続に成功しました';
        statusEl.className = 'settings-status success';
      } catch (e) {
        statusEl.textContent = '❌ ' + e.message;
        statusEl.className = 'settings-status error';
        state.settings.apiKey = prevKey;
        state.settings.model = prevModel;
      }
      testBtn.disabled = false;
    });
  }

  const resetBtn = document.getElementById('reset-data-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      const target = currentGoogleUser ? 'この端末とログイン中のGoogleアカウント' : 'この端末';
      openConfirmDanger(`${target}のすべてのデータを削除しますか？この操作は取り消せません。`, () => {
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState();
        saveState();
        showToast('データをリセットしました', 'info');
        renderApp();
      });
    });
  }
}

/* ---------- グローバルイベント委譲 ---------- */
function setupGlobalEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      selectedTargetChips = [];
      renderApp();
    });
  });

  document.getElementById('content').addEventListener('click', (e) => {
    const diffBtn = e.target.closest('[data-difficulty]');
    if (diffBtn) {
      setDifficulty(diffBtn.dataset.difficulty);
      return;
    }

    const actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      const action = actionBtn.dataset.action;
      if (action === 'generate-now') { generateMenu(); return; }
      if (action === 'update-menu') {
        openConfirm('今日のメニューを新しく作り直します。現在の進捗は上書きされます。よろしいですか？', () => generateMenu());
        return;
      }
      if (action === 'retry-generate') { generateMenu(); return; }
      if (action === 'go-settings') { currentTab = 'settings'; renderApp(); return; }

      // bindBodyTabEvents 内、または clickイベントのハンドラー内に追加
      if (action === 'open-muscle-guide') {
        openMuscleGuideModal();
        return;
      }

      if (action === 'open-body-chart') {
        openBodyChartModal();
        return;
      }
      
      const card = e.target.closest('.item-card');
      if (card && (action === 'done' || action === 'change' || action === 'edit-weight')) {
        const category = card.dataset.category;
        const id = card.dataset.id;
        if (action === 'change') changeGymItem(id);
        else if (action === 'edit-weight') openWeightModal(id);
        else toggleStatus(category, id);
        return;
      }
    }
  });

  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
    const actionBtn = e.target.closest('[data-action="close-modal"]');
    if (actionBtn) closeModal();
  });
}

/* ---------- 初期化 ---------- */
// ダークモードの状態に応じてアイコンを動的に切り替える関数
function updateFavicon() {
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const iconPath = isDark ? 'icon-dark.png' : 'icon-light.png';
  
  const iconLink = document.getElementById('app-icon');
  const appleIconLink = document.getElementById('app-apple-icon');
  if (iconLink) iconLink.href = iconPath;
  if (appleIconLink) appleIconLink.href = iconPath;
}

// リアルタイムの切り替えも監視
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);

// 【修正後】
function init() {
  updateFavicon();
  setupGlobalEvents();
  
  // 日付が変わっている場合は今日のメニューをリセットするだけにする（自動生成はしない）
  const ds = todayStr();
  if (state.today && state.today.date !== ds) {
    if (menuHasAnyDone(state.today.menu)) appendHistoryEntry(state.today);
    state.today = null; // メニューをリセットして「未作成」の状態にする
  }

  // 読み込み時に正規化した旧データも、現在の保存形式へ更新する
  saveState({ localOnly: true });
  renderApp(); // 自動生成は行わず、常に現在の状態（未作成なら作成ボタン画面）を描画
  initializeFirebaseSync();
}

document.addEventListener('DOMContentLoaded', init);

</script>
