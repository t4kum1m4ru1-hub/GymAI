<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AIジムコーチ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root {
  --bg: #ffffff;
  --bg-secondary: #f5f5f7;
  --text-primary: #1d1d1f;
  --text-secondary: #86868b;
  --accent: #0071e3;
  --accent-dark: #0059b3;
  --ring-stretch: #64d2ff;
  --ring-gym: #0071e3;
  --ring-pool: #32ade6;
  --ring-sauna: #ff9f0a;
  --success: #34c759;
  --success-bg: #e8f8ec;
  --danger: #ff3b30;
  --danger-bg: #fdeceb;
  --border: #e5e5ea;
  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-secondary);
  font-family: var(--font);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

button, input, textarea {
  font-family: inherit;
}

a { color: var(--accent); }

#app {
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}

.nav-bar {
  padding: 18px 20px 12px;
  position: sticky;
  top: 0;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: saturate(180%) blur(12px);
  z-index: 5;
  border-bottom: 1px solid var(--border);
}
.nav-bar h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

#content {
  flex: 1;
  padding: 20px 20px 100px;
}

/* ---------- タブバー ---------- */
.tabbar {
  position: sticky;
  bottom: 0;
  display: flex;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--border);
  padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index: 5;
}
.tab-btn {
  flex: 1;
  background: none;
  border: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 6px 2px;
  color: var(--text-secondary);
  cursor: pointer;
  border-radius: var(--radius-sm);
  transition: color 0.2s ease;
}
.tab-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tab-btn span { font-size: 11px; font-weight: 500; }
.tab-btn.active { color: var(--accent); }

/* ---------- 見出し ---------- */
.page-title { margin: 4px 0 14px; }
.page-title h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.page-title h3 { margin: 24px 0 10px; font-size: 17px; font-weight: 600; color: var(--text-secondary); }

/* ---------- Today ヘッダー / リング ---------- */
.today-header { text-align: center; padding-bottom: 8px; }
.today-date { color: var(--text-secondary); font-size: 14px; font-weight: 500; margin: 0 0 8px; }
.rings-wrap { display: flex; justify-content: center; }
.rings-svg { width: 190px; height: 190px; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--bg-secondary); stroke-width: 14; }
.ring-progress { fill: none; stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 0.7s cubic-bezier(.4,0,.2,1); }
.rings-legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 16px; }
.rings-legend span { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
.rings-legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.ai-comment { font-size: 14px; color: var(--text-primary); background: var(--bg-secondary); padding: 12px 16px; border-radius: var(--radius-md); margin: 12px 0; text-align: left; line-height: 1.5; }

.btn-refresh { width: 100%; margin-top: 4px; }

/* ---------- バナー ---------- */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; text-align: left; margin: 8px 0; }
.banner-info { background: #eaf3ff; color: var(--accent-dark); }
.banner-warn { background: #fff4e5; color: #b5680b; }
.banner-ai { background: #eefaf1; color: #1a7a3d; justify-content: center; }
.banner-link { background: none; border: none; font-weight: 600; color: inherit; text-decoration: underline; cursor: pointer; white-space: nowrap; padding: 0; }

/* ---------- メニューセクション / カード ---------- */
.menu-section { margin-top: 28px; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.section-icon { font-size: 24px; }
.section-header h2 { margin: 0; font-size: 17px; font-weight: 700; }
.section-sub { margin: 0; font-size: 12px; color: var(--text-secondary); }
.section-count { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text-secondary); background: var(--bg-secondary); padding: 4px 10px; border-radius: 20px; }

.item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.item-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  transition: background 0.2s ease, opacity 0.2s ease;
}
.item-card.done { background: var(--success-bg); border-color: transparent; }
.item-card.skipped { opacity: 0.55; }
.item-main { min-width: 0; flex: 1 1 140px; }
.item-name { margin: 0; font-size: 15px; font-weight: 600; }
.item-detail { margin: 2px 0 0; font-size: 13px; color: var(--text-secondary); }
.item-badge { display: inline-block; margin-top: 6px; font-size: 11px; color: #b5680b; background: #fff4e5; padding: 2px 8px; border-radius: 10px; }

.item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-pill {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-primary);
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.btn-hint { color: var(--accent); border-color: #cfe4fb; }
.btn-skip.active { background: #ffe9e6; color: var(--danger); border-color: transparent; }
.btn-done.active { background: var(--success); color: #fff; border-color: transparent; }
.btn-pill:active { transform: scale(0.94); }

/* ---------- 空の状態 ---------- */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-state.small { padding: 30px 16px; }
.empty-emoji { font-size: 40px; margin: 0 0 8px; }
.empty-state h2 { font-size: 19px; margin: 0 0 6px; }
.empty-state p { color: var(--text-secondary); font-size: 14px; margin: 0 0 18px; }

/* ---------- ボタン共通 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 14px; padding: 13px 18px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; text-decoration: none; transition: transform 0.15s ease, opacity 0.15s ease; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-outline { background: var(--bg); color: var(--accent); border: 1px solid var(--accent); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-outline { background: var(--bg); color: var(--danger); border: 1px solid var(--danger); width: 100%; }
.btn-text-danger { background: none; border: none; color: var(--danger); font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; }

/* ---------- 記録タブ ---------- */
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 14px 8px; text-align: center; }
.stat-value { margin: 0; font-size: 22px; font-weight: 700; }
.stat-label { margin: 2px 0 0; font-size: 11px; color: var(--text-secondary); }

.history-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.history-row { background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px 14px; }
.history-date { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.history-stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); }

/* ---------- 体の変化タブ ---------- */
.card { background: var(--bg-secondary); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; }
.field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 14px 0 6px; }
.field-label:first-child { margin-top: 0; }
.text-input { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); padding: 11px 13px; font-size: 15px; color: var(--text-primary); resize: vertical; }
.text-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); background: var(--bg); border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.card .btn-primary { width: 100%; margin-top: 18px; }

.body-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.body-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; background: var(--bg-secondary); border-radius: var(--radius-md); padding: 12px 14px; }
.body-row-date { margin: 0; font-size: 13px; font-weight: 700; }
.body-row-detail { margin: 3px 0 0; font-size: 13px; color: var(--text-secondary); }
.body-row-memo { margin: 4px 0 0; font-size: 12px; color: var(--text-secondary); font-style: italic; }

/* ---------- 設定タブ ---------- */
.settings-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 14px; }
.settings-hint { font-size: 12px; color: var(--text-secondary); margin: 8px 0 0; }
.input-with-btn { display: flex; gap: 8px; align-items: center; }
.input-with-btn .text-input { flex: 1; }
.btn-icon-toggle { border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius-sm); width: 42px; height: 42px; flex-shrink: 0; cursor: pointer; font-size: 16px; }
.settings-actions { display: flex; gap: 10px; margin-top: 18px; }
.settings-actions .btn { flex: 1; }
.settings-status { font-size: 13px; font-weight: 600; margin: 12px 0 0; min-height: 18px; }
.settings-status.success { color: var(--success); }
.settings-status.error { color: var(--danger); }

/* ---------- モーダル ---------- */
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.overlay.hidden { display: none; }
.modal { background: var(--bg); width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.modal-icon { font-size: 22px; }
.modal-header h3 { margin: 0; font-size: 18px; font-weight: 700; }
.modal-detail { font-size: 14px; color: var(--text-secondary); margin: 0 0 8px; }
.modal-tip { font-size: 14px; line-height: 1.6; background: var(--bg-secondary); padding: 12px 14px; border-radius: var(--radius-md); margin: 0 0 18px; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn, .modal-actions a.btn { flex: 1; text-align: center; }

/* ---------- トースト ---------- */
#toast-container { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-width: 440px; padding: 0 20px; pointer-events: none; }
.toast { background: rgba(29, 29, 31, 0.92); color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transform: translateY(10px); transition: opacity 0.25s ease, transform 0.25s ease; text-align: center; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: rgba(52, 199, 89, 0.95); }
.toast.error { background: rgba(255, 59, 48, 0.95); }

/* ---------- ローディング ---------- */
#loading-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 40; }
#loading-overlay.hidden { display: none; }
.spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay p { font-size: 14px; color: var(--text-secondary); margin: 0; }

/* ---------- アクセシビリティ / レスポンシブ ---------- */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

@media (max-width: 380px) {
  .item-actions { width: 100%; justify-content: flex-end; }
  .rings-svg { width: 160px; height: 160px; }
}
</style>
</head>

  "・commentには、体重や進捗を踏まえた短い励ましや助言を2文以内で書くこと。",
  "・出力は必ず指定のJSONスキーマの形式のみで返し、前置きや説明文は含めないこと。"
].join("\n");

const MENU_SCHEMA = {
  type: "OBJECT",
  properties: {
    stretch: {
      type: "ARRAY",
      items: {
        type: "OBJECT",
        properties: {
          name: { type: "STRING" },
          detail: { type: "STRING" },
          tip: { type: "STRING" }
        },
        required: ["name", "detail"]
      }
    },
    gym: {
      type: "ARRAY",
      items: {
        type: "OBJECT",
        properties: {
          name: { type: "STRING", enum: EQUIPMENT_LIST },
          reps: { type: "STRING" },
          tip: { type: "STRING" }
        },
        required: ["name", "reps"]
      }
    },
    pool: {
      type: "ARRAY",
      items: {
        type: "OBJECT",
        properties: {
          style: { type: "STRING" },
          distance: { type: "STRING" },
          tip: { type: "STRING" }
        },
        required: ["style", "distance"]
      }
    },
    sauna: {
      type: "ARRAY",
      items: {
        type: "OBJECT",
        properties: {
          duration: { type: "STRING" },
          tip: { type: "STRING" }
        },
        required: ["duration"]
      }
    },
    comment: { type: "STRING" }
  },
  required: ["stretch", "gym", "pool", "sauna", "comment"]
};

const CATEGORY_META = {
  stretch: { label: "ストレッチ", sub: "ウォーミングアップ", icon: "🤸" },
  gym: { label: "ジム", sub: "筋力トレーニング", icon: "🏋️" },
  pool: { label: "プール", sub: "水泳", icon: "🏊" },
  sauna: { label: "サウナ", sub: "リカバリー", icon: "🧖" }
};

/* ---------- 状態管理 ---------- */
function defaultState() {
  return {
    settings: { apiKey: "", model: DEFAULT_MODEL },
    today: null,
    historyLog: [],
    bodyRecords: [],
    skipCounts: {},
    completedCounts: {}
  };
}

let state = loadState();
let currentTab = 'today';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const base = defaultState();
    return {
      settings: Object.assign({}, base.settings, parsed.settings),
      today: parsed.today || null,
      historyLog: Array.isArray(parsed.historyLog) ? parsed.historyLog : [],
      bodyRecords: Array.isArray(parsed.bodyRecords) ? parsed.bodyRecords : [],
      skipCounts: parsed.skipCounts || {},
      completedCounts: parsed.completedCounts || {}
    };
  } catch (e) {
    console.error('状態の読み込みに失敗しました', e);
    return defaultState();
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('状態の保存に失敗しました', e);
    showToast('保存に失敗しました（ストレージ容量を確認してください）', 'error');
  }
}

/* ---------- ユーティリティ ---------- */
function uid() {
  return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

function todayStr(d) {
  const date = d || new Date();
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatDateLabel(ds) {
  const d = new Date(ds + 'T00:00:00');
  const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
  return `${d.getMonth() + 1}月${d.getDate()}日（${weekdays[d.getDay()]}）`;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function ytSearchUrl(query) {
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query + " やり方 フォーム 解説");
}

function makeItem(name, detail, tip, icon) {
  return { id: uid(), name, detail, tip: tip || '', icon: icon || '', status: 'pending', skipStreak: 0 };
}

function defaultTipFor(category, name) {
  if (category === 'gym') return EQUIPMENT_TIPS[name] || "フォームを意識して、丁寧に動作を行いましょう。";
  if (category === 'pool') return POOL_TIP_DEFAULT;
  if (category === 'sauna') return SAUNA_TIP;
  return STRETCH_TIP_DEFAULT;
}

function normalizeMenu(raw) {
  const stretch = (raw.stretch || []).map(s => makeItem(s.name, s.detail, s.tip || defaultTipFor('stretch', s.name)));
  const gym = (raw.gym || []).map(g => makeItem(g.name, g.reps, g.tip || defaultTipFor('gym', g.name)));
  const pool = (raw.pool || []).map(p => makeItem(p.style, p.distance, p.tip || defaultTipFor('pool', p.style)));
  const sauna = (raw.sauna || []).map(s => makeItem('サウナ', s.duration, s.tip || defaultTipFor('sauna', 'サウナ')));
  return { stretch, gym, pool, sauna };
}

/* ---------- 日付管理 / アーカイブ ---------- */
function archiveTodayIfNeeded() {
  const ds = todayStr();
  if (state.today && state.today.date !== ds) {
    const items = [];
    ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => {
      (state.today.menu[cat] || []).forEach(it => items.push({ category: cat, name: it.name, detail: it.detail, status: it.status }));
    });
    state.historyLog.push({ date: state.today.date, items });
    if (state.historyLog.length > 60) state.historyLog = state.historyLog.slice(-60);
    state.today = null;
  }
}

function needsNewMenu() {
  archiveTodayIfNeeded();
  return !state.today;
}

/* ---------- フォールバック（AI未使用時のダミーロジック） ---------- */
function getLatestBodyRecord() {
  if (!state.bodyRecords.length) return null;
  return state.bodyRecords.slice().sort((a, b) => a.date < b.date ? 1 : -1)[0];
}

function getFrequentlySkipped(limit) {
  const entries = Object.entries(state.skipCounts).filter(([, c]) => c >= 2);
  entries.sort((a, b) => b[1] - a[1]);
  return entries.slice(0, limit || 3).map(([name]) => name);
}

function matchConcernTargets(concernText) {
  if (!concernText) return [];
  const targets = new Set();
  CONCERN_MAP.forEach(rule => {
    if (rule.keywords.some(k => concernText.includes(k))) {
      rule.targets.forEach(t => targets.add(t));
    }
  });
  return Array.from(targets);
}

function buildFallbackMenu() {
  const latestBody = getLatestBodyRecord();
  const concernText = latestBody ? [latestBody.concerns, latestBody.memo].filter(Boolean).join(' ') : '';
  const priorityTargets = matchConcernTargets(concernText);
  const skippedOften = getFrequentlySkipped(4);

  // ジム: 気になる部位を優先しつつ、よくスキップされる種目は後回しにする
  let gymPool = shuffleArray(EQUIPMENT_LIST);
  gymPool.sort((a, b) => {
    const aPriority = priorityTargets.includes(a) ? -1 : 0;
    const bPriority = priorityTargets.includes(b) ? -1 : 0;
    if (aPriority !== bPriority) return aPriority - bPriority;
    const aSkip = skippedOften.includes(a) ? 1 : 0;
    const bSkip = skippedOften.includes(b) ? 1 : 0;
    return aSkip - bSkip;
  });
  const gymNames = gymPool.slice(0, 5);
  const gym = gymNames.map(name => ({ name, reps: pickRandom(REPS_OPTIONS), tip: EQUIPMENT_TIPS[name] }));

  const stretchItems = shuffleArray(STRETCH_POOL).slice(0, 4);
  const stretch = stretchItems.map(s => ({ name: s.name, detail: s.detail, tip: s.tip }));

  const style = pickRandom(SWIM_STYLES);
  const laps = 6 + Math.floor(Math.random() * 5);
  const pool = [{ style, distance: `25m × ${laps}本`, tip: POOL_TIP_DEFAULT }];

  const sauna = [{ duration: pickRandom(SAUNA_DURATIONS), tip: SAUNA_TIP }];

  let comment = "シンプルモードで作成した基本メニューです。設定タブでGemini APIキーを登録すると、AIが体の変化に合わせて自動で最適化します。";
  const sorted = state.bodyRecords.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  if (sorted.length >= 2 && sorted[0].weight != null && sorted[1].weight != null) {
    const diff = sorted[0].weight - sorted[1].weight;
    if (diff < -0.1) comment = `体重が前回より${Math.abs(diff).toFixed(1)}kg減っています。順調です、この調子で続けましょう！`;
    else if (diff > 0.1) comment = `体重は前回より少し増えていますが、焦らず継続することが大切です。`;
    else comment = `体重は前回とほぼ変わりません。安定したペースで続けていきましょう。`;
  }

  return { stretch, gym, pool, sauna, comment };
}

/* ---------- Gemini API 連携 ---------- */
function buildHistoryLines() {
  const recent = state.historyLog.slice(-7);
  if (!recent.length) return [];
  return recent.map(day => {
    const counts = {};
    ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => {
      const items = day.items.filter(i => i.category === cat);
      const done = items.filter(i => i.status === 'done').length;
      counts[cat] = `${done}/${items.length}`;
    });
    return `${day.date}: ストレッチ${counts.stretch} / ジム${counts.gym} / プール${counts.pool} / サウナ${counts.sauna}`;
  });
}

function buildUserPrompt() {
  const lines = [];
  lines.push("【直近の実施履歴（最大7日分）】");
  const historyLines = buildHistoryLines();
  if (historyLines.length) lines.push(...historyLines);
  else lines.push("まだ記録がありません（初回の利用です）。");

  lines.push("");
  lines.push("【よくスキップされる種目】");
  const skipped = getFrequentlySkipped(3);
  lines.push(skipped.length ? skipped.join("、") : "特になし");

  lines.push("");
  lines.push("【体の記録】");
  const latestBody = getLatestBodyRecord();
  if (latestBody) {
    lines.push(`最新の記録日: ${latestBody.date}`);
    lines.push(`体重: ${latestBody.weight != null ? latestBody.weight + 'kg' : '未記録'}`);
    lines.push(`気になるところ: ${latestBody.concerns || '特になし'}`);
    if (latestBody.memo) lines.push(`メモ: ${latestBody.memo}`);
  } else {
    lines.push("まだ記録がありません。");
  }

  lines.push("");
  lines.push("この情報を踏まえて、今日の最適なメニューをJSONで出力してください。");
  return lines.join("\n");
}

async function callGeminiAPI() {
  const { apiKey, model } = state.settings;
  const useModel = model || DEFAULT_MODEL;
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(useModel)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents: [{ role: "user", parts: [{ text: buildUserPrompt() }] }],
    generationConfig: {
      responseMimeType: "application/json",
      responseSchema: MENU_SCHEMA,
      temperature: 0.9
    }
  };

  const res = await fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    let detail = '';
    try { const errJson = await res.json(); detail = errJson.error?.message || ''; } catch (e) { /* ignore */ }
    throw new Error(`APIエラー (${res.status}) ${detail}`);
  }

  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
  if (!text) throw new Error("AIからの応答が空でした");

  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch (e) {
    throw new Error("AIの応答をJSONとして解析できませんでした");
  }
  return parsed;
}

async function testGeminiConnection() {
  const { apiKey, model } = state.settings;
  if (!apiKey) throw new Error("APIキーが入力されていません");
  const useModel = model || DEFAULT_MODEL;
  const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(useModel)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const body = { contents: [{ role: "user", parts: [{ text: "こんにちは。これは接続テストです。「OK」とだけ返答してください。" }] }] };
  const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!res.ok) {
    let detail = '';
    try { const errJson = await res.json(); detail = errJson.error?.message || ''; } catch (e) { /* ignore */ }
    throw new Error(`接続に失敗しました (${res.status}) ${detail}`);
  }
  return true;
}

/* ---------- メニュー生成のメインフロー ---------- */
async function generateMenu(options) {
  options = options || {};
  const hasKey = !!state.settings.apiKey;
  setLoading(true);

  let menu, comment, source;
  if (hasKey) {
    try {
      const raw = await callGeminiAPI();
      const normalized = normalizeMenu(raw);
      menu = normalized;
      comment = raw.comment || "今日も一緒に頑張りましょう！";
      source = 'ai';
    } catch (e) {
      console.error(e);
      const fb = buildFallbackMenu();
      menu = normalizeMenu(fb);
      comment = fb.comment;
      source = 'fallback-error';
      if (!options.silent) showToast('AIへの接続に失敗したため、シンプルメニューを表示します', 'error');
    }
  } else {
    const fb = buildFallbackMenu();
    menu = normalizeMenu(fb);
    comment = fb.comment;
    source = 'fallback';
  }

  state.today = { date: todayStr(), menu, comment, source };
  saveState();
  setLoading(false);
  renderApp();
}

/* ---------- ステータス操作 ---------- */
function toggleStatus(category, id, action) {
  if (!state.today) return;
  const arr = state.today.menu[category];
  const idx = arr.findIndex(i => i.id === id);
  if (idx < 0) return;
  const item = arr[idx];

  if (action === 'done') {
    if (item.status === 'done') {
      item.status = 'pending';
    } else {
      item.status = 'done';
      state.completedCounts[item.name] = (state.completedCounts[item.name] || 0) + 1;
    }
  } else if (action === 'skip') {
    if (item.status === 'skipped') {
      item.status = 'pending';
    } else {
      state.skipCounts[item.name] = (state.skipCounts[item.name] || 0) + 1;
      item.skipStreak = (item.skipStreak || 0) + 1;
      if (category === 'gym') {
        item.status = 'pending';
        arr.splice(idx, 1);
        arr.push(item);
      } else {
        item.status = 'skipped';
      }
    }
  }
  saveState();
  renderApp();
}

/* ---------- 体の記録 ---------- */
let selectedConcernChips = [];

function saveBodyRecord(weightVal, concernsArr, memoVal) {
  const ds = todayStr();
  const existingIdx = state.bodyRecords.findIndex(r => r.date === ds);
  const record = {
    id: existingIdx >= 0 ? state.bodyRecords[existingIdx].id : uid(),
    date: ds,
    weight: weightVal,
    concerns: concernsArr.join('、'),
    memo: memoVal
  };
  if (existingIdx >= 0) state.bodyRecords[existingIdx] = record;
  else state.bodyRecords.push(record);
  saveState();
}

function deleteBodyRecord(id) {
  state.bodyRecords = state.bodyRecords.filter(r => r.id !== id);
  saveState();
  renderApp();
}

/* ---------- 集計 ---------- */
function categoryCounts(category) {
  if (!state.today) return { done: 0, total: 0 };
  const arr = state.today.menu[category] || [];
  return { done: arr.filter(i => i.status === 'done').length, total: arr.length };
}

function computeStreak() {
  const days = state.historyLog.map(d => ({ date: d.date, done: d.items.some(i => i.status === 'done') }));
  if (state.today) {
    const anyDone = ['stretch', 'gym', 'pool', 'sauna'].some(c => (state.today.menu[c] || []).some(i => i.status === 'done'));
    days.push({ date: state.today.date, done: anyDone });
  }
  days.sort((a, b) => a.date < b.date ? 1 : -1);
  let streak = 0;
  let expected = new Date();
  for (const d of days) {
    const exStr = todayStr(expected);
    if (d.date === exStr) {
      if (d.done) {
        streak++;
        expected.setDate(expected.getDate() - 1);
      } else break;
    } else break;
  }
  return streak;
}

function computeAverageCompletion() {
  const days = state.historyLog.slice();
  if (state.today) {
    const items = [];
    ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => (state.today.menu[cat] || []).forEach(i => items.push({ category: cat, status: i.status })));
    days.push({ date: state.today.date, items });
  }
  if (!days.length) return 0;
  const rates = days.map(d => {
    if (!d.items.length) return 0;
    const done = d.items.filter(i => i.status === 'done').length;
    return done / d.items.length;
  });
  const avg = rates.reduce((a, b) => a + b, 0) / rates.length;
  return Math.round(avg * 100);
}

/* ---------- UIヘルパー: トースト / モーダル ---------- */
function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type || 'info'}`;
  el.textContent = message;
  container.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

function openModal(html) {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  box.innerHTML = html;
  overlay.classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

function openHint(category, id) {
  const item = (state.today.menu[category] || []).find(i => i.id === id);
  if (!item) return;
  const meta = CATEGORY_META[category];
  const query = category === 'gym' ? item.name + ' 筋トレ' : category === 'pool' ? item.name + ' 泳ぎ方' : category === 'sauna' ? 'サウナ 正しい入り方' : item.name + ' ストレッチ';
  openModal(`
    <div class="modal-header">
      <span class="modal-icon">${meta.icon}</span>
      <h3>${escapeHtml(item.name)}</h3>
    </div>
    <p class="modal-detail">${escapeHtml(item.detail)}</p>
    <p class="modal-tip">${escapeHtml(item.tip)}</p>
    <div class="modal-actions">
      <a class="btn btn-outline" href="${ytSearchUrl(query)}" target="_blank" rel="noopener">YouTubeでフォームを見る</a>
      <button type="button" class="btn btn-primary" data-action="close-modal">閉じる</button>
    </div>
  `);
}

function openConfirm(message, onConfirm) {
  openModal(`
    <div class="modal-header"><h3>確認</h3></div>
    <p class="modal-detail">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" data-action="close-modal">キャンセル</button>
      <button type="button" class="btn btn-primary" id="confirm-yes">更新する</button>
    </div>
  `);
  document.getElementById('confirm-yes').addEventListener('click', () => {
    closeModal();
    onConfirm();
  });
}

function setLoading(isLoading) {
  const el = document.getElementById('loading-overlay');
  if (!el) return;
  el.classList.toggle('hidden', !isLoading);
}

/* ---------- レンダリング ---------- */
function renderApp() {
  renderTabbar();
  const content = document.getElementById('content');
  if (currentTab === 'today') content.innerHTML = renderTodayTab();
  else if (currentTab === 'records') content.innerHTML = renderRecordsTab();
  else if (currentTab === 'body') content.innerHTML = renderBodyTab();
  else if (currentTab === 'settings') content.innerHTML = renderSettingsTab();

  if (currentTab === 'today') updateRings();
  if (currentTab === 'body') bindBodyTabEvents();
  if (currentTab === 'settings') bindSettingsTabEvents();
}

function renderTabbar() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === currentTab);
  });
}

function renderRingsSvg() {
  const cats = ['stretch', 'gym', 'pool', 'sauna'];
  const radii = { stretch: 88, gym: 68, pool: 48, sauna: 28 };
  const colors = { stretch: 'var(--ring-stretch)', gym: 'var(--ring-gym)', pool: 'var(--ring-pool)', sauna: 'var(--ring-sauna)' };
  const circles = cats.map(cat => {
    const r = radii[cat];
    const c = 2 * Math.PI * r;
    return `
      <circle cx="100" cy="100" r="${r}" class="ring-track"></circle>
      <circle cx="100" cy="100" r="${r}" class="ring-progress" id="ring-${cat}"
        stroke="${colors[cat]}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${c.toFixed(2)}"></circle>
    `;
  }).join('');
  return `<svg viewBox="0 0 200 200" class="rings-svg">${circles}</svg>`;
}

function updateRings() {
  if (!state.today) return;
  ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => {
    const { done, total } = categoryCounts(cat);
    const percent = total ? done / total : 0;
    const circle = document.getElementById(`ring-${cat}`);
    if (!circle) return;
    const r = parseFloat(circle.getAttribute('r'));
    const c = 2 * Math.PI * r;
    const offset = c * (1 - percent);
    circle.style.strokeDashoffset = offset.toFixed(2);
  });
}

function renderBanner() {
  if (!state.today) return '';
  const src = state.today.source;
  if (src === 'fallback') {
    return `<div class="banner banner-info">
      <span>💡 APIキー未設定のためシンプルモードで表示中です。</span>
      <button type="button" class="banner-link" data-action="go-settings">設定する</button>
    </div>`;
  }
  if (src === 'fallback-error') {
    return `<div class="banner banner-warn">
      <span>⚠️ AI接続に失敗したためシンプルメニューを表示中です。</span>
      <button type="button" class="banner-link" data-action="retry-generate">再試行</button>
    </div>`;
  }
  return `<div class="banner banner-ai"><span>✨ AIが今日のあなたに合わせて作成したメニューです</span></div>`;
}

function renderItemCard(category, item) {
  const doneActive = item.status === 'done' ? 'active' : '';
  const skipActive = item.status === 'skipped' ? 'active' : '';
  const badge = (category === 'gym' && item.skipStreak) ? `<span class="item-badge">混雑のため後回し ×${item.skipStreak}</span>` : '';
  return `
    <li class="item-card ${item.status}" data-id="${item.id}" data-category="${category}">
      <div class="item-main">
        <p class="item-name">${escapeHtml(item.name)}</p>
        <p class="item-detail">${escapeHtml(item.detail)}</p>
        ${badge}
      </div>
      <div class="item-actions">
        <button type="button" class="btn-pill btn-hint" data-action="hint" aria-label="ヒントを見る">ヒント</button>
        <button type="button" class="btn-pill btn-skip ${skipActive}" data-action="skip" aria-label="スキップ">スキップ</button>
        <button type="button" class="btn-pill btn-done ${doneActive}" data-action="done" aria-label="完了">${item.status === 'done' ? '✓ 完了' : '完了'}</button>
      </div>
    </li>
  `;
}

function renderSection(category) {
  const meta = CATEGORY_META[category];
  const items = state.today.menu[category] || [];
  const { done, total } = categoryCounts(category);
  return `
    <section class="menu-section">
      <div class="section-header">
        <span class="section-icon">${meta.icon}</span>
        <div>
          <h2>${meta.label}</h2>
          <p class="section-sub">${meta.sub}</p>
        </div>
        <span class="section-count">${done}/${total}</span>
      </div>
      <ul class="item-list">
        ${items.map(it => renderItemCard(category, it)).join('')}
      </ul>
    </section>
  `;
}

function renderTodayTab() {
  if (!state.today) {
    return `
      <div class="empty-state">
        <p class="empty-emoji">🏋️‍♀️</p>
        <h2>今日のメニューを準備しましょう</h2>
        <p>ボタンを押すとAIが最適なメニューを作成します。</p>
        <button type="button" class="btn btn-primary" data-action="generate-now">メニューを作成する</button>
      </div>
    `;
  }

  return `
    <div class="today-header">
      <p class="today-date">${formatDateLabel(state.today.date)}</p>
      <div class="rings-wrap">
        ${renderRingsSvg()}
      </div>
      <div class="rings-legend">
        <span><i style="background:var(--ring-stretch)"></i>ストレッチ</span>
        <span><i style="background:var(--ring-gym)"></i>ジム</span>
        <span><i style="background:var(--ring-pool)"></i>プール</span>
        <span><i style="background:var(--ring-sauna)"></i>サウナ</span>
      </div>
      ${renderBanner()}
      <p class="ai-comment">${escapeHtml(state.today.comment || '')}</p>
      <button type="button" class="btn btn-outline btn-refresh" data-action="update-menu">メニューを更新</button>
    </div>
    ${renderSection('stretch')}
    ${renderSection('gym')}
    ${renderSection('pool')}
    ${renderSection('sauna')}
  `;
}

function renderRecordsTab() {
  const streak = computeStreak();
  const avg = computeAverageCompletion();
  const totalDays = state.historyLog.length + (state.today ? 1 : 0);
  const days = state.historyLog.slice().reverse();

  const rows = days.map(day => {
    const counts = {};
    ['stretch', 'gym', 'pool', 'sauna'].forEach(cat => {
      const items = day.items.filter(i => i.category === cat);
      const done = items.filter(i => i.status === 'done').length;
      counts[cat] = `${done}/${items.length}`;
    });
    return `
      <li class="history-row">
        <div class="history-date">${formatDateLabel(day.date)}</div>
        <div class="history-stats">
          <span>🤸 ${counts.stretch}</span>
          <span>🏋️ ${counts.gym}</span>
          <span>🏊 ${counts.pool}</span>
          <span>🧖 ${counts.sauna}</span>
        </div>
      </li>
    `;
  }).join('');

  return `
    <div class="page-title"><h2>記録</h2></div>
    <div class="stats-grid">
      <div class="stat-card"><p class="stat-value">${totalDays}</p><p class="stat-label">記録日数</p></div>
      <div class="stat-card"><p class="stat-value">${streak}</p><p class="stat-label">連続日数</p></div>
      <div class="stat-card"><p class="stat-value">${avg}%</p><p class="stat-label">平均達成率</p></div>
    </div>
    ${days.length ? `<ul class="history-list">${rows}</ul>` : `
      <div class="empty-state small">
        <p>まだ記録がありません。トレーニングを続けると、ここに日々の記録が表示されます。</p>
      </div>
    `}
  `;
}

function renderBodyTab() {
  const ds = todayStr();
  const todayRecord = state.bodyRecords.find(r => r.date === ds);
  if (todayRecord && !selectedConcernChips.length && todayRecord.concerns) {
    selectedConcernChips = todayRecord.concerns.split('、').filter(Boolean);
  }
  const records = state.bodyRecords.slice().sort((a, b) => a.date < b.date ? 1 : -1);

  const chips = CONCERN_CHIPS.map(c => {
    const active = selectedConcernChips.includes(c) ? 'active' : '';
    return `<button type="button" class="chip ${active}" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
  }).join('');

  const list = records.map(r => `
    <li class="body-row">
      <div class="body-row-main">
        <p class="body-row-date">${formatDateLabel(r.date)}</p>
        <p class="body-row-detail">${r.weight != null ? r.weight + 'kg' : '体重未記録'}${r.concerns ? ' ・ ' + escapeHtml(r.concerns) : ''}</p>
        ${r.memo ? `<p class="body-row-memo">${escapeHtml(r.memo)}</p>` : ''}
      </div>
      <button type="button" class="btn-text-danger" data-delete-body="${r.id}">削除</button>
    </li>
  `).join('');

  return `
    <div class="page-title"><h2>体の変化</h2></div>
    <div class="card">
      <label class="field-label" for="input-weight">体重 (kg)</label>
      <input type="number" id="input-weight" class="text-input" step="0.1" inputmode="decimal" placeholder="例: 62.5" value="${todayRecord && todayRecord.weight != null ? todayRecord.weight : ''}">
      <label class="field-label">気になるところ</label>
      <div class="chip-row">${chips}</div>
      <label class="field-label" for="input-memo">メモ（任意）</label>
      <textarea id="input-memo" class="text-input" rows="2" placeholder="体調やその他のメモ">${todayRecord ? escapeHtml(todayRecord.memo || '') : ''}</textarea>
      <button type="button" class="btn btn-primary" id="save-body-btn">今日の記録を保存</button>
    </div>
    <div class="page-title"><h3>これまでの記録</h3></div>
    ${records.length ? `<ul class="body-list">${list}</ul>` : `<div class="empty-state small"><p>まだ記録がありません。体重や気になるところを記録すると、AIメニューに反映されます。</p></div>`}
  `;
}

function renderSettingsTab() {
  const { apiKey, model } = state.settings;
  return `
    <div class="page-title"><h2>設定</h2></div>
    <div class="card">
      <p class="settings-desc">Google Gemini APIキーを登録すると、AIがあなたの履歴と体の変化に合わせて毎回メニューを自動生成します。未設定でもシンプルモードでアプリは動作します。</p>
      <label class="field-label" for="input-apikey">Gemini APIキー</label>
      <div class="input-with-btn">
        <input type="password" id="input-apikey" class="text-input" placeholder="APIキーを入力" value="${escapeHtml(apiKey)}">
        <button type="button" class="btn-icon-toggle" id="toggle-key-visibility" aria-label="表示切替">👁</button>
      </div>
      <label class="field-label" for="input-model">モデル名</label>
      <input type="text" id="input-model" class="text-input" placeholder="${DEFAULT_MODEL}" value="${escapeHtml(model || '')}">
      <p class="settings-hint">無料のAPIキーは <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> で取得できます。</p>
      <div class="settings-actions">
        <button type="button" class="btn btn-outline" id="test-connection-btn">接続テスト</button>
        <button type="button" class="btn btn-primary" id="save-settings-btn">保存する</button>
      </div>
      <p id="settings-status" class="settings-status"></p>
    </div>
    <div class="card">
      <p class="settings-desc">保存されているすべてのデータ（進捗・体の記録・APIキー）はこの端末のブラウザ内にのみ保存されます。</p>
      <button type="button" class="btn btn-danger-outline" id="reset-data-btn">すべてのデータをリセット</button>
    </div>
  `;
}

/* ---------- タブごとのイベントバインド ---------- */
function bindBodyTabEvents() {
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.chip;
      const i = selectedConcernChips.indexOf(val);
      if (i >= 0) selectedConcernChips.splice(i, 1);
      else selectedConcernChips.push(val);
      chip.classList.toggle('active');
    });
  });

  const saveBtn = document.getElementById('save-body-btn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const weightInput = document.getElementById('input-weight').value;
      const weight = weightInput === '' ? null : parseFloat(weightInput);
      const memo = document.getElementById('input-memo').value.trim();
      saveBodyRecord(weight, selectedConcernChips, memo);
      showToast('記録を保存しました', 'success');
      renderApp();
    });
  }

  document.querySelectorAll('[data-delete-body]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.deleteBody;
      deleteBodyRecord(id);
      showToast('記録を削除しました', 'info');
    });
  });
}

function bindSettingsTabEvents() {
  const toggleBtn = document.getElementById('toggle-key-visibility');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      const input = document.getElementById('input-apikey');
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  }

  const saveBtn = document.getElementById('save-settings-btn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      state.settings.apiKey = document.getElementById('input-apikey').value.trim();
      state.settings.model = document.getElementById('input-model').value.trim() || DEFAULT_MODEL;
      saveState();
      showToast('設定を保存しました', 'success');
    });
  }

  const testBtn = document.getElementById('test-connection-btn');
  if (testBtn) {
    testBtn.addEventListener('click', async () => {
      const statusEl = document.getElementById('settings-status');
      const tempKey = document.getElementById('input-apikey').value.trim();
      const tempModel = document.getElementById('input-model').value.trim() || DEFAULT_MODEL;
      const prevKey = state.settings.apiKey, prevModel = state.settings.model;
      state.settings.apiKey = tempKey;
      state.settings.model = tempModel;
      statusEl.textContent = '接続を確認しています…';
      statusEl.className = 'settings-status';
      testBtn.disabled = true;
      try {
        await testGeminiConnection();
        statusEl.textContent = '✅ 接続に成功しました';
        statusEl.className = 'settings-status success';
      } catch (e) {
        statusEl.textContent = '❌ ' + e.message;
        statusEl.className = 'settings-status error';
        state.settings.apiKey = prevKey;
        state.settings.model = prevModel;
      }
      testBtn.disabled = false;
    });
  }

  const resetBtn = document.getElementById('reset-data-btn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      openConfirmDanger('本当にすべてのデータを削除しますか？この操作は取り消せません。', () => {
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState();
        showToast('データをリセットしました', 'info');
        renderApp();
      });
    });
  }
}

function openConfirmDanger(message, onConfirm) {
  openModal(`
    <div class="modal-header"><h3>確認</h3></div>
    <p class="modal-detail">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" data-action="close-modal">キャンセル</button>
      <button type="button" class="btn btn-danger" id="confirm-danger-yes">削除する</button>
    </div>
  `);
  document.getElementById('confirm-danger-yes').addEventListener('click', () => {
    closeModal();
    onConfirm();
  });
}

/* ---------- グローバルイベント委譲 ---------- */
function setupGlobalEvents() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      selectedConcernChips = [];
      renderApp();
    });
  });

  document.getElementById('content').addEventListener('click', (e) => {
    const actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      const action = actionBtn.dataset.action;
      if (action === 'generate-now') { generateMenu(); return; }
      if (action === 'update-menu') {
        openConfirm('今日のメニューを新しく作り直します。現在の進捗は記録として保存されます。よろしいですか？', () => generateMenu());
        return;
      }
      if (action === 'retry-generate') { generateMenu(); return; }
      if (action === 'go-settings') { currentTab = 'settings'; renderApp(); return; }
      const card = e.target.closest('.item-card');
      if (card && (action === 'hint' || action === 'done' || action === 'skip')) {
        const category = card.dataset.category;
        const id = card.dataset.id;
        if (action === 'hint') openHint(category, id);
        else toggleStatus(category, id, action);
        return;
      }
    }
  });

  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') closeModal();
    const actionBtn = e.target.closest('[data-action="close-modal"]');
    if (actionBtn) closeModal();
  });
}

/* ---------- 初期化 ---------- */
function init() {
  setupGlobalEvents();
  if (needsNewMenu()) {
    generateMenu({ silent: true });
  } else {
    renderApp();
  }
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
